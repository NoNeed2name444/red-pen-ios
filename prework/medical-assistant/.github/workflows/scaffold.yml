name: Offline scaffold check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 scripts/prework.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --test --test-isolation=none tests/app.test.mjs
