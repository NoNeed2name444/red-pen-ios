# Temporary: which .icon variants does actool compile, per Xcode. Removed after.
name: Icon probe
on:
  push:
    branches: ['design/icon-layers']
    paths: ['.github/workflows/icon-probe.yml']
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          cat > /tmp/probe.py <<'EOF'
          import json, os, shutil, struct, subprocess, sys, zlib, copy
          src = "ios/AppResources/AppIcon.icon"
          base = json.load(open(f"{src}/icon.json"))
          def png(path):
              w = h = 64
              raw = b"".join(b"\x00" + b"\x20\x80\xff\xff" * w for _ in range(h))
              def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b""))
          V = {}
          V["current"] = (base, "svg")
          apple = {"fill": {"automatic-gradient": "extended-srgb:0.00000,0.53333,1.00000,1.00000"},
                   "groups": [{"layers": [{"image-name": "x.png", "name": "x"}], "shadow": {"kind": "neutral", "opacity": 0.5},
                               "translucency": {"enabled": True, "value": 0.5}}],
                   "supported-platforms": {"circles": ["watchOS"], "squares": "shared"}}
          V["apple-png"] = (apple, "png")
          V["empty-groups"] = ({**apple, "groups": []}, None)
          for f in sorted(os.listdir(f"{src}/Assets")):
              a = copy.deepcopy(apple); a["groups"][0]["layers"] = [{"image-name": f, "name": "x"}]
              V["apple-" + f] = (a, "svg")
          c = copy.deepcopy(base); c["fill"].pop("orientation", None); V["no-orientation"] = (c, "svg")
          c = copy.deepcopy(base); c.pop("color-space-for-untagged-svg-colors"); V["no-colorspace"] = (c, "svg")
          c = copy.deepcopy(base); c["fill"] = apple["fill"]; V["auto-fill"] = (c, "svg")
          c = copy.deepcopy(base)
          for g in c["groups"]:
              g.pop("specular", None); g["translucency"]["enabled"] = True
              for l in g["layers"]: l.pop("glass", None)
          V["plain-groups"] = (c, "svg")
          c = copy.deepcopy(base)
          for g in c["groups"]:
              for l in g["layers"]: l["image-name"] = "x.png"
          V["current-png"] = (c, "png")
          xcodes = sys.argv[1:]
          for name, (j, kind) in V.items():
              d = f"/tmp/v/{name}/AppIcon.icon"; shutil.rmtree(f"/tmp/v/{name}", ignore_errors=True); os.makedirs(d + "/Assets")
              json.dump(j, open(d + "/icon.json", "w"), indent=2)
              if kind == "svg":
                  for f in os.listdir(f"{src}/Assets"): shutil.copy(f"{src}/Assets/{f}", d + "/Assets/")
              if kind == "png": png(d + "/Assets/x.png")
              res = []
              for x in xcodes:
                  out = f"/tmp/out/{name}-{x}"; os.makedirs(out, exist_ok=True)
                  env = {**os.environ, "DEVELOPER_DIR": f"/Applications/{x}.app/Contents/Developer"}
                  p = subprocess.run(["xcrun", "actool", d, "ios/RedPen/Assets.xcassets", "--compile", out, "--platform", "iphoneos",
                                      "--minimum-deployment-target", "17.0", "--app-icon", "AppIcon", "--target-device", "iphone",
                                      "--target-device", "ipad", "--output-partial-info-plist", out + "/p.plist",
                                      "--output-format", "human-readable-text", "--errors", "--warnings"],
                                     capture_output=True, text=True, env=env)
                  txt = (p.stdout + p.stderr).replace("\n", " | ")
                  ok = p.returncode == 0 and "nil object" not in txt and "error" not in txt.lower()
                  res.append(f"{x}: {'OK' if ok else 'FAIL rc=%d %s' % (p.returncode, txt[:300])}")
              print(f"{name:28} " + "  ||  ".join(res), flush=True)
          EOF
          python3 /tmp/probe.py Xcode_26.0.1 Xcode_26.4.1 Xcode_26.6
