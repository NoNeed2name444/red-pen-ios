# Builds the SwiftUI app on GitHub's free macOS runner, opens it in the iOS
# Simulator once per screen (light and dark), and pushes the screenshots -
# real SwiftUI pixels - to the `previews` branch, together with the build
# log and any compile errors.
#
# Pushes to aahp/ branches (changes proposed by an automated loop) are built
# and screenshotted the same way but publish nothing: their screenshots stay
# in the run's ios-preview artifact.
name: iOS preview

on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Only these screens, space-separated (e.g. signin account-deleted library-loading); empty for the usual set'
        required: false
        default: ''
  push:
    branches: ['aahp/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-preview.yml'

# Read-only: the preview job builds and runs the app's code. Only the publish
# job, which runs none of it, can write.
permissions:
  contents: read

# A second dispatch cancels the first, because two runs racing to force-push
# the same branch is worse than losing one of them. aahp/ branches publish
# nothing, so each gets a group of its own.
concurrency:
  group: ${{ startsWith(github.ref_name, 'aahp/') && format('ios-preview-{0}', github.ref) || 'ios-preview' }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # no token left in .git/config for the build: the packages it
        # compiles (and their macros and plugins) run in later steps, and
        # the publish job brings its own token
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          candidates = []
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-") if x.isdigit())
              for d in devs:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name:
                      continue
                  # newest runtime first, then a plain "Pro" over Max / base models
                  candidates.append(((version, name.endswith("Pro"), "Pro" in name, name), d["udid"], name, runtime))
          candidates.sort()
          _, udid, name, runtime = candidates[-1]
          print(f"udid={udid}")
          print(f"name={name}")
          print(f"runtime={runtime.rsplit('.', 1)[-1]}")
          print("picked", name, runtime, file=sys.stderr)
          PY

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          # LocalLLMClient ships a macro plugin; Xcode normally asks an
          # interactive "do you trust this macro" question the first time,
          # which a headless CI run can never answer. These flags are
          # xcodebuild's own bypass - the same as clicking Trust once.
          #
          # LocalLLMClientLlamaC's headers are really C++, and Xcode's
          # explicit-modules pre-scan reads that C target through a plain-C
          # Clang context that never gets libc++'s search paths, so it cannot
          # find <memory>. Disabling explicit modules falls back to the older,
          # working implicit scanning.
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|warning:|BUILD |\*\* " || true
          # xcodebuild's own exit status is hidden by the grep above, and the .app
          # folder exists even after a failed compile - so ask the log instead
          grep -q "BUILD SUCCEEDED" ../build.log

      # `!cancelled()` rather than `always()`, everywhere below.
      #
      # A run cancelled mid-compile by the next dispatch used to reach these
      # steps anyway, find a build log that stops halfway, and publish
      # build_ok:false over a perfectly good previous result - a verdict of
      # "broken" on a build that was never allowed to finish. A cancelled run
      # now leaves the branch exactly as it found it.
      - name: Screenshots
        if: ${{ !cancelled() }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          SCREENS: ${{ inputs.screens }}
        run: |
          # NOT set -e. A screen that fails to launch used to abort the whole
          # step, so one bad screen cost all thirty-six and left nothing to say
          # which one it was. Each screen now records its own failure and the
          # run carries on.
          APP="ios/build/Build/Products/Debug-iphonesimulator/RedPen.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged \
            --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p previews
          # A launch slower than the seven seconds allowed below leaves the
          # system's launch screen in the photo instead of the app: about one
          # shot in fifty, on any screen, and a pair that compares the launch
          # screen with a real screen shows nothing. launch_screen.py tells
          # the two apart by colour, from a tiny copy; a photo of the launch
          # screen is taken again after a longer wait, twice at most, and a
          # photo the check cannot read is kept as it is. It lives outside
          # previews/ so it is never published.
          probe="$RUNNER_TEMP/probe.png"
          cat > "$RUNNER_TEMP/launch_screen.py" <<'PY'
          # Is this photo the system launch screen rather than the app? The launch
          # screen is navy all over (about 8,29,52 on average); every screen of the
          # app averages far from that, the darkest (dark mode) near 46,51,59. Reads
          # the small copy sips makes. Exit 0: launch screen; 1: not; 2: can't tell.
          import struct, sys, zlib


          def mean_rgb(path):
              data = open(path, "rb").read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              pos, idat, head = 8, [], None
              while pos + 8 <= len(data):
                  size, kind = struct.unpack(">I4s", data[pos:pos + 8])
                  if kind == b"IHDR":
                      head = struct.unpack(">IIBBBBB", data[pos + 8:pos + 21])
                  elif kind == b"IDAT":
                      idat.append(data[pos + 8:pos + 8 + size])
                  elif kind == b"IEND":
                      break
                  pos += 12 + size
              if head is None:
                  return None
              width, height, depth, colour, _, _, interlace = head
              if depth != 8 or colour not in (2, 6) or interlace:
                  return None
              step = 3 if colour == 2 else 4
              stride = width * step
              raw = zlib.decompress(b"".join(idat))
              if len(raw) < height * (stride + 1):
                  return None
              prev, sums = bytearray(stride), [0, 0, 0]
              for y in range(height):
                  start = y * (stride + 1)
                  kind, row = raw[start], bytearray(raw[start + 1:start + 1 + stride])
                  if kind > 4:
                      return None
                  for i in range(stride):
                      a = row[i - step] if i >= step else 0
                      b = prev[i]
                      c = prev[i - step] if i >= step else 0
                      if kind == 1:
                          row[i] = (row[i] + a) & 255
                      elif kind == 2:
                          row[i] = (row[i] + b) & 255
                      elif kind == 3:
                          row[i] = (row[i] + (a + b) // 2) & 255
                      elif kind == 4:
                          p = a + b - c
                          pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                          row[i] = (row[i] + (a if pa <= pb and pa <= pc else b if pb <= pc else c)) & 255
                  for x in range(0, stride, step):
                      sums[0] += row[x]
                      sums[1] += row[x + 1]
                      sums[2] += row[x + 2]
                  prev = row
              return [s / (width * height) for s in sums]


          if __name__ == "__main__":
              rgb = mean_rgb(sys.argv[1])
              name = sys.argv[2] if len(sys.argv) > 2 else sys.argv[1]
              if rgb is None:
                  print(f"colour unknown: {name}")
                  sys.exit(2)
              r, g, b = rgb
              print(f"colour {r:.0f},{g:.0f},{b:.0f}: {name}")
              sys.exit(0 if r < 22 and b - r > 25 else 1)
          PY
          launch_screen() {
            if ! sips -z 32 16 "$1" --out "$probe" >/dev/null 2>&1; then
              echo "colour unknown (no small copy): $(basename "$1")" >> previews/shots.log
              return 2
            fi
            python3 -I "$RUNNER_TEMP/launch_screen.py" "$probe" "$(basename "$1")" >> previews/shots.log 2>&1
          }
          # The last five are the newer screens (see PreviewExtras): the live
          # Quiz me button, the quiz the app builds out of a deck's own
          # answers, fixing a misheard word in an Arabic transcript, the quiz
          # with its study bar folded, and the library scrolled to its end,
          # where the last row has to clear the dock.
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for screen in ${SCREENS:-library new quiz quiz-checked summary anki anki-revealed book osce osce-revealed osce-complete narrate narrate-finished anki-quizable quiz-from-cards narrate-fixing quiz-folded library-end}; do
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              if ! xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen "$screen" >> previews/shots.log 2>&1; then
                echo "launch failed: $screen ($mode)" >> previews/shots.log
                continue
              fi
              sleep 7
              shot="previews/$screen-$mode.png"
              xcrun simctl io "$UDID" screenshot --type=png --mask=alpha "$shot" \
                >> previews/shots.log 2>&1 || echo "shot failed: $screen ($mode)" >> previews/shots.log
              tries=0
              while [ -f "$shot" ] && launch_screen "$shot"; do
                if [ "$tries" -ge 2 ]; then
                  echo "still the launch screen: $screen ($mode)" >> previews/shots.log
                  break
                fi
                tries=$((tries + 1))
                echo "launch screen, retake $tries: $screen ($mode)" >> previews/shots.log
                sleep 8
                xcrun simctl io "$UDID" screenshot --type=png --mask=alpha "$shot" \
                  >> previews/shots.log 2>&1 || break
              done
            done
          done
          # A crash on launch is the one failure the log above cannot explain,
          # so the report itself comes back with the screenshots.
          for report in ~/Library/Logs/DiagnosticReports/RedPen*.ips; do
            [ -f "$report" ] && cp "$report" previews/ && echo "crash report: $(basename "$report")" >> previews/shots.log
          done
          # phone-sized copies are plenty for a web page (the originals are 3x)
          for f in previews/*.png; do sips --resampleWidth 780 "$f" --out "$f" >/dev/null || true; done
          ls -la previews

      - name: Record the outcome
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ steps.sim.outputs.name }}
          RUNTIME: ${{ steps.sim.outputs.runtime }}
        run: |
          mkdir -p previews
          cp build.log previews/build.log 2>/dev/null || true
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -80 > previews/errors.txt || true
          python3 - <<'PY'
          import datetime, json, os, subprocess
          shots = sorted(f for f in os.listdir("previews") if f.endswith(".png"))
          log = open("build.log", errors="replace").read() if os.path.exists("build.log") else ""
          status = {
              "commit": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "when": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "xcode": subprocess.run(["xcodebuild", "-version"], capture_output=True, text=True).stdout.strip().replace("\n", " "),
              "device": os.environ.get("DEVICE", ""),
              "runtime": os.environ.get("RUNTIME", ""),
              "build_ok": "BUILD SUCCEEDED" in log,
              # A log that mentions neither outcome is a run that was stopped,
              # not a build that failed - worth saying which.
              "build_finished": ("BUILD SUCCEEDED" in log) or ("BUILD FAILED" in log),
              "screens": shots,
          }
          json.dump(status, open("previews/status.json", "w"), indent=2)
          print(json.dumps(status, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-preview
          path: previews

  # Separate from the build so the write token never shares a job with the
  # app's code. Never for aahp/ branches.
  publish:
    needs: preview
    if: ${{ !cancelled() && !startsWith(github.ref_name, 'aahp/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-preview
          path: previews

      - name: Publish to the previews branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd previews
          git init -q
          git checkout -q -b previews
          git config user.name "red-pen-preview"
          git config user.email "preview@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS preview of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews:previews
