name: apply
on:
  workflow_dispatch:
    inputs:
      sha256: {required: true}
      message: {required: true}
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat .transfer/q-* > /tmp/p.b64
          base64 -d /tmp/p.b64 | xz -d > /tmp/p.patch
          echo "${{ inputs.sha256 }}  /tmp/p.patch" | sha256sum -c -
          git apply /tmp/p.patch
          rm -rf .transfer .github/workflows/apply.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "${{ inputs.message }}"
          git push
