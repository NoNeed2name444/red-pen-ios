# The open stand-in for Jev (§22a; plan, the owner's third round, item 7).
#
# Layer 7, the oath check (server/oath.js: our own rules plus the source
# proof, fail closed), is measured on labelled claims: any miss fails the run
# (§22a: "any miss blocks launch").
# Layer 6, card and question triage: an open NLI cross-encoder scores every
# option, in batch, on this runner's CPU (tools/jev-standin/score_nli.py), and
# its thresholds are tuned on labelled items (triage.mjs), confirmed on a
# held-out half. Free and open only: the model comes from the Hugging Face
# Hub; no paid model is ever called and no secret is used.
#
# Which model: the "model" input, else the TRIAGE_NLI_MODEL repository
# variable, else tools/jev-standin/default-model.json (a biomedical NLI
# cross-encoder under the MIT licence, small enough for the runner's CPU).
# Which items: our own labelled ones (tools/jev-standin/own-labels.jsonl,
# when it exists), or else the public gold-labelled sets of
# tools/label-sets/registry.json (each licence allows commercial use; no
# label comes from a checking model), about 400 per gate.
# Results: the run summary and the jev-standin artifact.
name: Jev stand-in
on:
  # a push that changes the stand-in or its label sets runs it too (the run
  # button only lists workflows on main)
  push:
    branches: ['design/verify-mechanisms', 'standin/run']
    paths: ['tools/jev-standin/**', 'tools/label-sets/**', 'server/oath.js', '.github/workflows/jev-standin.yml']
  workflow_dispatch:
    inputs:
      model:
        description: 'Hub id of an open NLI cross-encoder (empty: the TRIAGE_NLI_MODEL variable, else the default)'
        required: false
        default: ''
      entail_index:
        description: 'Which class is entailment, for a model whose classes are LABEL_0.. only (empty: read from the model)'
        required: false
        default: ''
      per_gate:
        description: 'Public labelled items per gate when there are no own labels (half right, half wrong)'
        required: false
        default: '400'
permissions:
  contents: read
concurrency:
  group: jev-standin
  cancel-in-progress: false
jobs:
  standin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The label sets (public, gold-labelled, licence-checked)
        run: |
          mkdir -p out
          tools/verification-bench/fetch.sh data > /dev/null
          node tools/label-sets/build.mjs --bench data --out out/labels --per-gate "${{ inputs.per_gate || '400' }}"
      - name: Layer 7, the oath check on labelled claims
        run: |
          files=tools/jev-standin/oath-seed.jsonl
          [ -f tools/jev-standin/own-oath-labels.jsonl ] && files="$files tools/jev-standin/own-oath-labels.jsonl"
          node tools/jev-standin/oath-bench.mjs $files | tee out/oath.md
          # the FDA's own dosing and safety sentences: measured and reported;
          # the launch bar is on our own labels above
          node tools/jev-standin/oath-bench.mjs --report out/labels/oath.jsonl | tee out/oath-fda.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/jev-standin.yml'
      - name: Layer 6, the items
        run: |
          if [ -f tools/jev-standin/own-labels.jsonl ]; then
            node tools/jev-standin/items.mjs --labels tools/jev-standin/own-labels.jsonl > out/items.jsonl
          else
            node tools/jev-standin/items.mjs --labels out/labels/items.jsonl > out/items.jsonl
          fi
          wc -l out/items.jsonl
      - name: Layer 6, scored by the open model (CPU)
        env:
          MODEL: ${{ inputs.model || vars.TRIAGE_NLI_MODEL }}
          ENTAIL: ${{ inputs.entail_index }}
        run: |
          if [ -z "$MODEL" ]; then
            MODEL=$(node -p "require('./tools/jev-standin/default-model.json').hub")
            [ -n "$ENTAIL" ] || ENTAIL=$(node -p "require('./tools/jev-standin/default-model.json').entailIndex")
          fi
          echo "Model: $MODEL (entailment class: ${ENTAIL:-from its config})" | tee -a "$GITHUB_STEP_SUMMARY"
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install --quiet transformers==4.46.3 sentencepiece==0.2.0 protobuf==5.28.3
          python tools/jev-standin/score_nli.py --model "$MODEL" ${ENTAIL:+--entail-index "$ENTAIL"} --items out/items.jsonl --out out/scores.jsonl
      - name: Layer 6, thresholds tuned and confirmed
        run: node tools/jev-standin/triage.mjs --items out/items.jsonl --scores out/scores.jsonl --out out
      - name: Summary
        if: always()
        run: |
          [ -f out/labels/sets.json ] && { echo '## Label sets'; echo '```json'; cat out/labels/sets.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -f out/oath.md ] && cat out/oath.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/oath-fda.md ] && sed -n '1,12p' out/oath-fda.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/report.md ] && cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-standin
          path: |
            out/*.md
            out/labels/sets.json
            out/thresholds.json
            out/scores.jsonl
          if-no-files-found: ignore
