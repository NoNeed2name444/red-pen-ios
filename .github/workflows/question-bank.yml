# Fetches licence-checked passages for the question bank (plan Task 5b step 2)
# and keeps them as a run artifact. Run by hand only: it asks MedlinePlus and
# NCBI for real, politely, and nothing here is secret. An NCBI_API_KEY secret,
# if one is ever added, only raises NCBI's limit from 3 to 10 requests a second.
name: Question bank sources
on:
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated topics (empty: tools/question-bank/topics.txt)'
        required: false
        default: ''
      pmc_per_topic:
        description: 'PMC Open Access articles to try per topic'
        required: false
        default: '2'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The licence gate and the fetcher's own tests first
        run: |
          node tests/governance/licences.test.mjs
          node tests/question-bank/fetch.test.mjs
      - name: Fetch
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          TOPICS: ${{ inputs.topics }}
          PMC_PER_TOPIC: ${{ inputs.pmc_per_topic }}
        run: |
          if [ -n "$TOPICS" ]; then set -- --topics "$TOPICS"; else set -- --topics-file tools/question-bank/topics.txt; fi
          node tools/question-bank/fetch.mjs --out out/passages.jsonl --pmc-per-topic "${PMC_PER_TOPIC:-2}" "$@"
          {
            echo "### Question bank sources"
            echo "Kept: $(wc -l < out/passages.jsonl) passages; refused: $(wc -l < out/passages.refused.jsonl)."
            echo '```'
            node -e 'const c={};for(const l of require("fs").readFileSync("out/passages.jsonl","utf8").split("\n").filter(Boolean)){const p=JSON.parse(l);c[p.source+" "+p.licence]=(c[p.source+" "+p.licence]||0)+1}for(const[k,v]of Object.entries(c))console.log(v,k)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-bank-passages
          path: out/
          if-no-files-found: warn
          retention-days: 30
