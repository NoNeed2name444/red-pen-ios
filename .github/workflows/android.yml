name: Android APK and screenshots
on:
  push:
    branches: ['android/kotlin']
    paths-ignore: ['screenshots/**', '**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 17 SDK
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-|build-tools;3[6-9]|system-images;android-(37|Cinnamon)'
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stethoscore-android-build
          path: |
            app/build/outputs/apk/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 17 SDK
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-|build-tools;3[6-9]|system-images;android-(37|Cinnamon)'
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: stethoscore-android-build
          path: built-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real Android screenshots and exercise study flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            bash scripts/capture-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stethoscore-android-screenshots
          path: |
            screenshots/
            test-results/
          retention-days: 30
      - name: Publish screenshots on Android branch
        if: success() && github.ref == 'refs/heads/android/kotlin'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Android study screens [skip ci]'
          git push origin HEAD:android/kotlin
