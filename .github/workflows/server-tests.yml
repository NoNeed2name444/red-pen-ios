# The sync worker's logic, run against a real SQLite, and CramDown Cloud's
# proxy against a fake upstream.
#
# Cheap and fast on purpose - Ubuntu and no install step - so that the parts
# of Red Pen that can lose a student's work, or give paid models away, are
# checked on every push rather than only when somebody remembers.
name: Server tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite, which these tests run against, arrived in 22.5.
          node-version: '22'
      - name: The sync worker
        run: node server/tests/sync.test.mjs
      - name: CramDown Cloud
        run: node server/tests/ai.test.mjs
      - name: Background generation jobs
        run: node server/tests/jobs.test.mjs
      - name: Linking a second device
        run: node server/tests/pair.test.mjs
