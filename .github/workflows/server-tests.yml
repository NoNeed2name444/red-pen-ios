# The sync worker's logic, run against a real SQLite, and CramDown Cloud's
# proxy against a fake upstream.
#
# Cheap and fast on purpose - Ubuntu and no install step - so that the parts
# of Red Pen that can lose a student's work, or give paid models away, are
# checked on every push rather than only when somebody remembers.
name: Server tests
on:
  workflow_dispatch:
  push:
    # the session branch is a copy of personal: testing it again only queues
    branches-ignore: ['claude/**']
    paths:
      - 'server/**'
      - 'governance/**'
      - 'tests/**'
      - 'tools/question-bank/**'
      - '.github/workflows/server-tests.yml'
      # the transcription benchmark's scorer, and the app prompt it rebuilds
      - 'tools/asr_bench.mjs'
      - 'ios/RedPen/Shared/CloudTranscript.swift'
      - 'ios/RedPen/Shared/LectureTranscriber.swift'
# Read-only: the tests need nothing more, and they also run on aahp/ branches.
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite, which these tests run against, arrived in 22.5.
          node-version: '22'
      - name: Every server test (sync, cloud models, jobs, pairing, voice, evidence, benchmarks, the transcription scorer) and the licence gate
        run: |
          failed=0
          for t in server/tests/*.test.mjs tests/*/*.test.mjs; do node "$t" || { echo "::error::$t failed"; failed=1; }; done
          exit $failed
