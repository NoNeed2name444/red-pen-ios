# The same screens, on an iPad, in both orientations.
#
# A separate workflow rather than more loops inside the iPhone one: the phone
# job is the compile check that must stay fast and must not be cancelled by
# this, and an iPad run answers a different question - does the split view
# actually look like a tablet app, or like a phone app stretched?
name: iPad preview
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # no token left in .git/config for the build: the packages it
        # compiles (and their macros and plugins) run in later steps, and
        # the push step brings its own token
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      - name: Let this build turn
        run: |
          set -euo pipefail
          # iOS ignores an orientation request from an iPad app that supports
          # multitasking. UIRequiresFullScreen restores the app's control over
          # its own orientation - patched into the GENERATED Info.plist here
          # rather than declared in project.yml, because the shipping app
          # should keep Split View and Stage Manager. A screenshot rig's
          # concession, not a decision about the product.
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" ios/RedPen/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" ios/RedPen/Info.plist
          # And make landscape the FIRST orientation offered: iOS picks the
          # launch orientation from the head of this list, so a portrait-first
          # list means every launch starts portrait and has to be turned.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" ios/RedPen/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" ios/RedPen/Info.plist
          for o in UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft \
                   UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown; do
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad: string $o" ios/RedPen/Info.plist
          done
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" ios/RedPen/Info.plist

      - name: Pick an iPad
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          best = []
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-") if x.isdigit())
              for d in devs:
                  name = d["name"]
                  if not name.startswith("iPad"):
                      continue
                  # Match the MODEL, not the word "Pro" anywhere in the name:
                  # an earlier run picked an "iPad mini (A17 Pro)", the
                  # smallest iPad Apple makes - the opposite of the wide screen
                  # a split view needs to be judged on.
                  if name.startswith("iPad Pro"):
                      rank = 3
                  elif name.startswith("iPad Air"):
                      rank = 2
                  elif name.startswith("iPad mini"):
                      rank = 0
                  else:
                      rank = 1
                  big = 1 if "13" in name else 0
                  best.append(((rank, big, version, name), d["udid"], name, runtime))
          best.sort()
          if not best:
              print("no iPad simulator on this runner", file=sys.stderr)
              raise SystemExit(1)
          _, udid, name, runtime = best[-1]
          print(f"udid={udid}")
          print(f"name={name}")
          print(f"runtime={runtime.rsplit('.', 1)[-1]}")
          print("picked", name, runtime, file=sys.stderr)
          PY

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          grep -q "BUILD SUCCEEDED" ../build.log

      - name: Screenshots
        if: ${{ !cancelled() }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP="ios/build/Build/Products/Debug-iphonesimulator/RedPen.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 \
            --batteryState charged --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p ipad
          for orient in portrait landscape; do
            for screen in library quiz quiz-checked anki-revealed book osce-revealed; do
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              if ! xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen "$screen" \
                     -uiPreviewOrientation "$orient" >> ipad/shots.log 2>&1; then
                echo "launch failed: $screen ($orient)" >> ipad/shots.log
                continue
              fi
              # Longer than the phone job: the rotation animation has to finish
              # before the picture is taken, or it catches the app mid-turn.
              sleep 9
              xcrun simctl io "$UDID" screenshot --type=png --mask=alpha \
                "ipad/$screen-$orient.png" >> ipad/shots.log 2>&1 \
                || echo "shot failed: $screen ($orient)" >> ipad/shots.log
              # The app writes down what happened when it asked to turn. A
              # print from a simctl launch goes nowhere, so this is the only
              # way to learn WHY a rotation was refused rather than guessing.
              if [ "$orient" = landscape ]; then
                CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null || true)
                if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/rotation.log" ]; then
                  echo "--- rotation.log for $screen" >> ipad/rotation.log
                  cat "$CONTAINER/Documents/rotation.log" >> ipad/rotation.log
                fi
              fi
            done
          done
          # A landscape shot that came out portrait means the rotation did not
          # take, and the run should say so rather than hand over a lie.
          python3 - <<'PY' >> ipad/shots.log
          import glob, struct
          def size(path):
              with open(path, "rb") as f:
                  head = f.read(33)
              return struct.unpack(">II", head[16:24])
          for f in sorted(glob.glob("ipad/*-landscape.png")):
              w, h = size(f)
              if w <= h:
                  print(f"NOT ACTUALLY LANDSCAPE: {f} is {w}x{h}")
          PY
          for f in ipad/*.png; do sips --resampleWidth 1200 "$f" --out "$f" >/dev/null || true; done
          ls -la ipad

      - name: Record and publish
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVICE: ${{ steps.sim.outputs.name }}
          RUNTIME: ${{ steps.sim.outputs.runtime }}
        run: |
          set -e
          mkdir -p ipad
          cp build.log ipad/build.log 2>/dev/null || true
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -60 > ipad/errors.txt || true
          python3 - <<'PY'
          import datetime, json, os
          log = open("build.log", errors="replace").read() if os.path.exists("build.log") else ""
          shots = open("ipad/shots.log", errors="replace").read() if os.path.exists("ipad/shots.log") else ""
          json.dump({
              "commit": os.environ["GITHUB_SHA"],
              "when": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "device": os.environ.get("DEVICE", ""),
              "runtime": os.environ.get("RUNTIME", ""),
              "build_ok": "BUILD SUCCEEDED" in log,
              "build_finished": ("BUILD SUCCEEDED" in log) or ("BUILD FAILED" in log),
              "rotation_worked": "NOT ACTUALLY LANDSCAPE" not in shots,
              "screens": sorted(f for f in os.listdir("ipad") if f.endswith(".png")),
          }, open("ipad/status.json", "w"), indent=2)
          PY
          cd ipad
          git init -q
          git checkout -q -b ipad-previews
          git config user.name "red-pen-preview"
          git config user.email "preview@users.noreply.github.com"
          git add -A
          git commit -q -m "iPad preview of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ipad-previews:ipad-previews

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ipad-preview
          path: ipad
