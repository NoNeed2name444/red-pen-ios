# Applying a batch of work that was written away from the bridge.
#
# Sending two dozen files one at a time is slow and expensive, so they travel as
# one compressed archive split across a few parts. This job puts the parts back
# together, checks the archive is exactly what was sent, unpacks it over the
# tree, and removes itself and the parts in the same commit.
#
# The checksum is the point. A part that arrived truncated would otherwise
# unpack into a tree of half-written source files, and the first sign of it
# would be a wall of compiler errors that look like real mistakes.
name: Unpack
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: Checksum of the archive the parts should rebuild
        required: true
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify the archive
        run: |
          set -e
          cat .transfer/part-* > /tmp/bundle.b64
          base64 -d /tmp/bundle.b64 > /tmp/bundle.txz
          echo "${{ inputs.sha256 }}  /tmp/bundle.txz" > /tmp/sum
          sha256sum -c /tmp/sum
      - name: Unpack it over the tree
        run: |
          set -e
          tar xJf /tmp/bundle.txz
          rm -rf .transfer .github/workflows/unpack.yml
      - name: Commit
        run: |
          git config user.name red-pen-transfer
          git config user.email transfer@users.noreply.github.com
          git add -A
          git commit -q -m "Cross-device sync: merge rules, engine, server and tests" || echo "nothing to commit"
          git push
