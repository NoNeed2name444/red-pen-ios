name: Unpack
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: sha256 of the base64 payload
        required: true
      message:
        description: commit message
        required: false
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          set -e
          cat .transfer/part-* > /tmp/payload.b64
          echo "${{ inputs.sha256 }}  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          mkdir -p /tmp/un && tar xJf /tmp/payload.tar.xz -C /tmp/un
          rm -rf /tmp/un/.github/workflows
          cp -a /tmp/un/. .
          rm -rf .transfer
      - name: Commit
        run: |
          git config user.name "unpack"
          git config user.email "unpack@users.noreply.github.com"
          git add -A
          git commit -m "${{ inputs.message || 'unpack transfer' }}" || exit 0
          git push origin HEAD:main
