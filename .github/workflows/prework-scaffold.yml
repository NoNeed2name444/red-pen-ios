name: Prework offline verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prework/medical-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prework/medical-assistant/package-lock.json
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group pyproject.toml:dev
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check scaffolds and synthetic pipelines
        run: |
          npm run check
          npm run lint
          npm test
          npm run test:browser
