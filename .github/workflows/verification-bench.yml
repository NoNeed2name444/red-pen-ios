# The verification layer measured on real exam questions (docs/verification):
# the sensors on every question as published and with errors planted, and the
# whole layer - literature, checker models of different families, the blind
# re-solve, the verdict - on hard questions (MedXpertQA, MedQA, CareQA), each
# with its true key and with a wrong key planted.
#
# Which checkers, by the secrets the repository has:
# - AI_API_KEY: the live Worker, with its own free models (what students get);
# - else BENCH_API_KEY + BENCH_BASE_URL (secrets) and BENCH_VOTERS (variable,
#   "bench:<model>,..." from at least two model families): this repository's
#   checkBatch with a free OpenAI-compatible provider's models.
# The `mode` input picks what a manual run does (a push runs `layer`, as before):
# - layer:     the whole layer, as above
# - proxy:     this branch's own checkBatch (layer.mjs --proxy), with the live
#              Worker (AI_API_KEY) only as a model proxy: the free voters pinned
#              in the live order, one named model a call, x-bench: 1. Spends the
#              Worker's bench allowance and Workers AI neurons: at most one a UTC day
# - retrieval: the retrieval set R (retrieval-set.mjs): no model, no neurons
# - proof:     the proof-only bench P (proof-only.mjs): no model, no neurons
# Results: the run summary, and runs/<run id>/ on verification-bench-results
# (every report and results file of the mode, with run.json: the cost of each batch).
name: Verification bench
on:
  push:
    branches: ['bench/verification']
  workflow_dispatch:
    inputs:
      per_source:
        description: 'Questions per source (each checked twice)'
        required: false
        default: '30'
      mode:
        description: 'What to run: layer, proxy, retrieval or proof'
        required: false
        type: choice
        options: [layer, proxy, retrieval, proof]
        default: 'layer'
      route:
        description: 'proxy mode: the vignette route (on, as live, or off)'
        required: false
        type: choice
        options: ['on', 'off']
        default: 'on'
permissions:
  contents: write
concurrency:
  group: verification-bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Questions
        run: tools/verification-bench/fetch.sh data
      - name: Sensors on every question
        if: (inputs.mode || 'layer') == 'layer' || inputs.mode == 'proxy'
        run: node tools/verification-bench/sensors.mjs data/*.json --out out/sensors > /dev/null
      - name: The whole layer on hard questions
        if: (inputs.mode || 'layer') == 'layer'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BENCH_BASE_URL: ${{ secrets.BENCH_BASE_URL }}
          BENCH_VOTERS: ${{ vars.BENCH_VOTERS }}
          N: ${{ inputs.per_source || '30' }}
        run: |
          [[ "$N" =~ ^[0-9]+$ ]] || exit 1
          if [ -n "$AI_API_KEY" ]; then
            export WORKER=https://redpen-auth.vv7sh4rnnw.workers.dev
            export KEY=$(printf 'cramdown-owner:%s' "$AI_API_KEY" | sha256sum | cut -c1-64)
            echo "::add-mask::$KEY"
            node tools/verification-bench/layer.mjs --data data --out out/layer --per-source "$N"
          elif [ -n "$BENCH_API_KEY" ] && [ -n "$BENCH_BASE_URL" ]; then
            node tools/verification-bench/layer.mjs --data data --out out/layer --per-source "$N" --voters "$BENCH_VOTERS"
          else
            echo "No checkers: add the AI_API_KEY secret (the live Worker), or BENCH_API_KEY and BENCH_BASE_URL secrets with a BENCH_VOTERS variable." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: This branch's checkBatch, the live Worker as the models' proxy
        if: inputs.mode == 'proxy'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          N: ${{ inputs.per_source || '30' }}
        run: |
          [[ "$N" =~ ^[0-9]+$ ]] || exit 1
          if [ -z "$AI_API_KEY" ]; then
            echo "Proxy mode needs the AI_API_KEY secret (the live Worker's owner key)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export WORKER=https://redpen-auth.vv7sh4rnnw.workers.dev
          export BENCH_BASE_URL="$WORKER/v1"
          export BENCH_API_KEY=$(printf 'cramdown-owner:%s' "$AI_API_KEY" | sha256sum | cut -c1-64)
          echo "::add-mask::$BENCH_API_KEY"
          node tools/verification-bench/layer.mjs --proxy --route "${{ inputs.route || 'on' }}" --data data --out out/layer --per-source "$N"
      - name: Retrieval set R (no model)
        if: inputs.mode == 'retrieval'
        run: node tools/verification-bench/retrieval-set.mjs --set both --data data --cache "$RUNNER_TEMP/ragbench-cache" --out out/retrieval
      - name: Proof-only bench P (no model)
        if: inputs.mode == 'proof'
        run: node tools/verification-bench/proof-only.mjs --data data --cache "$RUNNER_TEMP/ragbench-cache" --out out/proof
      - name: Summary
        if: always()
        run: |
          [ -f out/layer/report.md ] && cat out/layer/report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/retrieval/retrieval-report.md ] && cat out/retrieval/retrieval-report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/proof/proof-report.md ] && cat out/proof/proof-report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/sensors/report.md ] && sed -n '1,40p' out/sensors/report.md >> "$GITHUB_STEP_SUMMARY"
          true
      - name: Publish
        if: always()
        run: |
          [ -d out ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="$RUNNER_TEMP/results"
          if git fetch -q origin verification-bench-results; then
            git worktree add -q "$dest" FETCH_HEAD && git -C "$dest" checkout -q -B verification-bench-results
          else
            git worktree add -q --detach "$dest" && git -C "$dest" checkout -q --orphan verification-bench-results
          fi
          # results only: nothing of the repository rides along (an earlier
          # publish committed the whole tree beside the runs)
          git -C "$dest" rm -rqf --cached . > /dev/null 2>&1 || true
          find "$dest" -mindepth 1 -maxdepth 1 ! -name .git ! -name runs -exec rm -rf {} +
          mkdir -p "$dest/runs/${{ github.run_id }}"
          cp out/layer/report.md out/layer/results.json out/layer/run.json "$dest/runs/${{ github.run_id }}/" 2>/dev/null || true
          cp out/retrieval/retrieval-report.md out/retrieval/retrieval-results.json "$dest/runs/${{ github.run_id }}/" 2>/dev/null || true
          cp out/proof/proof-report.md out/proof/proof-results.json "$dest/runs/${{ github.run_id }}/" 2>/dev/null || true
          cp out/sensors/report.md "$dest/runs/${{ github.run_id }}/sensors.md" 2>/dev/null || true
          git -C "$dest" add -A
          git -C "$dest" commit -q -m "Verification bench run ${{ github.run_id }} (${{ github.sha }})" || exit 0
          git -C "$dest" push -q origin verification-bench-results
