# The Swift Playgrounds package, LAUNCHED - not just built. swiftpm-check.yml
# proves the package compiles; this one makes it the way the zip for the phone
# is made (tools/make_swiftpm.py), builds it for the simulator the way
# Playgrounds builds an App Playground (Debug, the package's own manifest:
# its generated Info.plist, capabilities and resources - no Xcode project),
# installs it on an iPhone and an iPad on iOS 26, taps it open (simctl
# launch, no test runner), waits 30 s and checks it is still running.
# Everything is kept: console, the simulator's log for the app, crash reports
# and screenshots - as artifacts, in the step summary, and on the
# launch-results branch (one folder per build and device, README on top).
# The "old-*" builds are earlier commits of personal, made with the script as
# it was then, to see whether a zip made from them already failed to launch.
name: Playgrounds launch
on:
  push:
    branches: [personal, ci/launch]
    paths: ['ios/**', 'tools/make_swiftpm.py', 'tools/sim_launch.sh', 'tools/launch_test_hook.py', '.github/workflows/swiftpm-launch.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: swiftpm-launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: current
            src: ''
            tool: ''
          # personal at 09:30 UTC on 25 Sep (4fced95), made with the first
          # committed make_swiftpm.py (da8b1bd, 11:11)
          - id: old-0930
            src: 4fced95
            tool: da8b1bd
          - id: old-1111
            src: da8b1bd
            tool: da8b1bd
          - id: old-1242
            src: 8f271f3
            tool: 8f271f3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make the package
        env:
          SRC: ${{ matrix.src }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          cp tools/sim_launch.sh tools/launch_test_hook.py "$RUNNER_TEMP/"
          make() {  # make <tree> <tool> <zip>
            (cd "$1" && python3 "$2" ios/RedPen "Stethoscore Personal" com.cramdown.personal "$3")
          }
          if [ -n "$SRC" ]; then
            git worktree add -q "$RUNNER_TEMP/src" "$SRC"
            git show "$TOOL:tools/make_swiftpm.py" > "$RUNNER_TEMP/make_swiftpm_old.py"
            make "$RUNNER_TEMP/src" "$RUNNER_TEMP/make_swiftpm_old.py" "$GITHUB_WORKSPACE/out/Stethoscore.zip"
            # the current package too, installed over the old one's data
            make "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/make_swiftpm.py" "$GITHUB_WORKSPACE/out/Current.zip"
            mkdir -p out/cur && (cd out/cur && unzip -q ../Current.zip)
            python3 "$RUNNER_TEMP/launch_test_hook.py" "out/cur/Stethoscore Personal.swiftpm"
          else
            make "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/make_swiftpm.py" "$GITHUB_WORKSPACE/out/Stethoscore.zip"
          fi
          cd out && rm -rf pkg && mkdir pkg && cd pkg && unzip -q ../Stethoscore.zip && ls
          cat "Stethoscore Personal.swiftpm/Package.swift"
          # CI only, simulator only: -launchTestSignedIn (see the script)
          python3 "$RUNNER_TEMP/launch_test_hook.py" "Stethoscore Personal.swiftpm"
      - name: Pick the simulators
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          phones, pads = [], []
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1]))
              if version < (26,):
                  continue
              for i, d in enumerate(devs):
                  n = d["name"]
                  if n.startswith("iPhone"):
                      phones.append((tuple(-v for v in version), 0 if " Pro" in n and "Max" not in n else 1, i, n, d["udid"]))
                  elif n.startswith("iPad"):
                      pads.append((tuple(-v for v in version), 0 if n.startswith("iPad Pro") else 1, i, n, d["udid"]))
          phones.sort(); pads.sort()
          for key, lst in (("iphone", phones), ("ipad", pads)):
              if lst:
                  print(f"{key}_udid={lst[0][4]}"); print(f"{key}_name={lst[0][3]}")
                  print(key, lst[0][3], file=sys.stderr)
          PY
      - name: Build for the simulator as Playgrounds would
        run: |
          set -o pipefail
          build() {  # build <package dir> <derived data> <log>
            (cd "$1" && xcodebuild -scheme "Stethoscore Personal" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath "$2" \
              -skipMacroValidation -skipPackagePluginValidation ARCHS=arm64 \
              build 2>&1 | tee "$3" | grep -E "error:|BUILD |\*\* " | head -100 || true)
            { echo "### ${{ matrix.id }}: build $(basename "$3")"; echo '```'; grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$3" | sed -E 's#^.*/Stethoscore Personal.swiftpm/##' | sort -u | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -q "BUILD SUCCEEDED" "$3"
          }
          build "out/pkg/Stethoscore Personal.swiftpm" "$RUNNER_TEMP/dd" "$GITHUB_WORKSPACE/out/build.log"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP"
          if [ -d out/cur ]; then
            build "out/cur/Stethoscore Personal.swiftpm" "$RUNNER_TEMP/dd-cur" "$GITHUB_WORKSPACE/out/build-current.log"
            echo "CUR_APP=$(find "$RUNNER_TEMP/dd-cur/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)" >> "$GITHUB_ENV"
          fi
          # the same app under another bundle id, as Swift Playgrounds runs it
          # (PersonalBuild then finds the marker file, not the id)
          OTHER="$RUNNER_TEMP/other/$(basename "$APP")"
          mkdir -p "$RUNNER_TEMP/other" && cp -R "$APP" "$OTHER"
          codesign -d --entitlements "$RUNNER_TEMP/ent.plist" --xml "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier swift-playgrounds-dev-run.launchtest" "$OTHER/Info.plist"
          if [ -s "$RUNNER_TEMP/ent.plist" ]; then
            sed -i '' 's/com\.cramdown\.personal/swift-playgrounds-dev-run.launchtest/g' "$RUNNER_TEMP/ent.plist"
            codesign -f -s - --entitlements "$RUNNER_TEMP/ent.plist" "$OTHER" || true
          else
            codesign -f -s - "$OTHER" || true
          fi
          echo "OTHER_APP=$OTHER" >> "$GITHUB_ENV"
      - name: Launch
        if: always() && env.APP != ''
        env:
          IPHONE: ${{ steps.sim.outputs.iphone_udid }}
          IPHONE_NAME: ${{ steps.sim.outputs.iphone_name }}
          IPAD: ${{ steps.sim.outputs.ipad_udid }}
          IPAD_NAME: ${{ steps.sim.outputs.ipad_name }}
        run: |
          R="$GITHUB_WORKSPACE/out/results/${{ matrix.id }}"
          mkdir -p "$R"; fails=0
          run() {  # run <device dir> <udid> <device name> <scenario> <app> <keep> [args]
            local dev="$1" udid="$2" name="$3" sc="$4" app="$5" keep="$6"; shift 6
            local D="$R/$dev/$sc"
            mkdir -p "$D"; echo "$name" > "$D/device.txt"
            KEEP="$keep" bash "$RUNNER_TEMP/sim_launch.sh" "$app" "$udid" "$D" 30 "$@"; local rc=$?
            echo "$dev/$sc=$rc" >> "$R/status.txt"
            { echo "### ${{ matrix.id }}: $name, $sc - $([ $rc = 0 ] && echo ALIVE || echo NOT RUNNING)"; echo '```'; head -c 40000 "$D/key.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            [ $rc = 0 ] || fails=$((fails + 1))
          }
          device() {  # device <dir> <udid> <name>
            local dev="$1" udid="$2" name="$3"
            [ -n "$udid" ] || { echo "no $dev simulator"; fails=$((fails + 1)); return; }
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b > /dev/null 2>&1 || true
            # a tap on the icon, with nothing there yet: the sign-in screen
            run "$dev" "$udid" "$name" 1-fresh "$APP" 0
            # signed in on this device only, as the owner is: the library,
            # and everything it starts at launch
            run "$dev" "$udid" "$name" 2-signed-in "$APP" 1 -launchTestSignedIn
            # opened again on the data that launch left
            run "$dev" "$udid" "$name" 3-relaunch "$APP" 1
            if [ -n "${CUR_APP:-}" ]; then
              # the current package installed over this old one's data
              run "$dev" "$udid" "$name" 4-upgrade-to-current "$CUR_APP" 1
            fi
            if [ "$dev" = iphone ]; then
              # another bundle id, as Swift Playgrounds gives the app
              run "$dev" "$udid" "$name" 5-other-bundle-id "$OTHER_APP" 0 -launchTestSignedIn
            fi
            xcrun simctl shutdown "$udid" || true
          }
          device iphone "$IPHONE" "$IPHONE_NAME"
          device ipad "$IPAD" "$IPAD_NAME"
          cat "$R/status.txt"
          [ $fails = 0 ]
      - name: Keep the build log
        if: always()
        run: |
          mkdir -p "out/results/${{ matrix.id }}"
          cp out/build.log "out/results/${{ matrix.id }}/build.log" 2>/dev/null || true
          cp out/build-current.log "out/results/${{ matrix.id }}/build-current.log" 2>/dev/null && gzip -f "out/results/${{ matrix.id }}/build-current.log" || true
          grep -E "error:|warning:" out/build.log 2>/dev/null | sed -E 's#^.*/Stethoscore Personal.swiftpm/##' | sort -u | head -200 > "out/results/${{ matrix.id }}/build-issues.txt" || true
          gzip -f "out/results/${{ matrix.id }}/build.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.id }}
          path: out/results/${{ matrix.id }}
  publish:
    needs: launch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: launch-*
      - name: Push to launch-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          for d in launch-*; do mv "$d" "${d#launch-}"; done
          {
            echo "# Playgrounds launch"
            echo
            echo "Commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_RUN_ID}."
            for b in */; do
              b="${b%/}"
              echo; echo "## $b"
              echo; echo '```'; cat "$b/status.txt" 2>/dev/null; echo '```'
              for sc in "$b"/*/*/; do
                sc="${sc%/}"
                [ -f "$sc/key.txt" ] || continue
                echo; echo "### ${sc#$b/}: $(cat "$sc/device.txt" 2>/dev/null)"
                echo; echo '```'; head -40 "$sc/key.txt"; echo '```'
                [ -f "$sc/screen.png" ] && echo "<img src=\"$sc/screen.png\" width=\"260\">"
              done
            done
          } > README.md
          git init -q && git checkout -q -b launch-results
          git config user.name red-pen-preview && git config user.email preview@users.noreply.github.com
          git add -A && git commit -q -m "launch results $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" launch-results:launch-results
