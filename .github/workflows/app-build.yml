# The whole app, compiled on every push to the personal branch - "Swift tests"
# only compiles the shared model code, so an error in a screen would otherwise
# first show up in the Swift Playgrounds build on the phone.
name: App build
on:
  push:
    # design/<name>: a design in progress is built and tapped through before it joins personal
    branches: [personal, 'design/**']
    paths: ['ios/**', '.github/workflows/app-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    # The full run on personal (compile, the UI suite, then accessibility)
    # took 61 minutes on 8 Oct and was cut off at 60. On 23 Oct (run
    # 39932576764) the UI suite alone ran 81 minutes before the job's 90
    # cut it, 45 of them the three million-map proof tests each waiting out
    # its 15 minutes: the job allows the suite's steps their own limits
    # (below) plus the build, the summaries and the upload.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          # the errors, where they can be read without downloading anything
          { echo '### Compile errors'; echo '```'; grep -E "error:" ../build.log | sed -E 's#^.*/ios/##' | sort -u | head -60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "BUILD SUCCEEDED" ../build.log
      # The simulator tap-through takes most of the run; a design branch gets the
      # compile check only. design/integration is the one version the owner gets,
      # so it runs the full suite on every push: a failure there is never hidden.
      #
      # What a stuck test may cost, so a failure shows by name instead of
      # eating the job:
      # - grep --line-buffered: each Test Case line reaches the log as it
      #   happens (a plain grep in a pipe holds its output in a block, and on
      #   23 Oct the cancel threw that block away: no Test Case line at all);
      # - XCTest's own limit per test, 16 minutes (the longest passing test,
      #   testDepthMeasure, took 12.6; the million proof tests wait up to 15
      #   for their map and then fail by name), so a test that hangs is
      #   stopped and named and the suite goes on;
      # - this step's limit is under the job's, so the summary and the
      #   upload after it still run when it is reached.
      - name: Tap through sign-in and the terms on a simulator
        id: ui
        if: ${{ (!startsWith(github.ref_name, 'design/') || github.ref_name == 'design/integration') }}
        timeout-minutes: 110
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build-sim \
            -resultBundlePath ../ui.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 960 \
            -maximum-test-execution-time-allowance 960 \
            -skip-testing:RedPenUITests/AccessibilityUITests \
            test 2>&1 | tee ../uitest.log | grep --line-buffered -E "error:|Test Case|TEST |\*\* " || true
          grep -q "TEST SUCCEEDED" ../uitest.log
      # its own step, so it is written also when the step above ran out of time
      - name: Summary of the tap-through
        if: ${{ always() && steps.ui.outcome != 'skipped' }}
        run: |
          {
            echo '### Sign-in and terms tap test'
            echo '```'
            if [ -f uitest.log ]; then
              # every failure, then the last tests run (the one running at a timeout among them)
              grep -E "error:" uitest.log | sed -E 's#^.*/ios/##' | head -40 || true
              grep -E "Test Case|TEST (SUCCEEDED|FAILED)" uitest.log | tail -20 || true
            else
              echo 'no uitest.log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The accessibility walk and audit at the largest text size: an audit
      # finding shows up here, in the summary, and as a red run. It must pass before the App
      # Store accessibility labels are claimed (docs/launch/accessibility.md).
      # Like the tap-through, it runs on personal and design/integration. A failure
      # here turns the run red: a green run must mean every check passed.
      - name: Accessibility at the largest text size
        id: a11y
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (!startsWith(github.ref_name, 'design/') || github.ref_name == 'design/integration') }}
        timeout-minutes: 20
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build-sim \
            -resultBundlePath ../a11y.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 480 \
            -only-testing:RedPenUITests/AccessibilityUITests \
            test 2>&1 | tee ../a11y.log | grep --line-buffered -E "error:|Test Case|TEST |\*\* " || true
          grep -q "TEST SUCCEEDED" ../a11y.log
      - name: Summary of the accessibility run
        if: ${{ always() && steps.a11y.outcome != 'skipped' }}
        run: |
          {
            echo '### Accessibility (AX5 text, audit)'
            echo '```'
            if [ -f a11y.log ]; then
              grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" a11y.log | tail -30 || true
            else
              echo 'no a11y.log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # the logs go with the result bundles: a bundle cut off by a time limit
      # has no summary of its own, and the log says which test was running
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test
          path: |
            ui.xcresult
            a11y.xcresult
            uitest.log
            a11y.log
          if-no-files-found: ignore
