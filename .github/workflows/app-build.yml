# The whole app, compiled on every push to the personal branch - "Swift tests"
# only compiles the shared model code, so an error in a screen would otherwise
# first show up in the Swift Playgrounds build on the phone.
name: App build
on:
  push:
    # design/<name>: a design in progress is built and tapped through before it joins personal
    branches: [personal, 'design/**']
    paths: ['ios/**', '.github/workflows/app-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    # The full run on personal (compile, the UI suite, then accessibility)
    # took 61 minutes on 8 Oct and was cut off at 60. On 23 Oct (run
    # 39932576764) the UI suite alone ran 81 minutes before the job's 90
    # cut it, 45 of them the three million-map proof tests each waiting out
    # its 15 minutes: the job allows the suite's steps their own limits
    # (below) plus the build, the summaries and the upload.
    timeout-minutes: 150
    steps:
      # the crash report step at the end keeps only reports newer than this
      - name: Note when the job began
        run: touch "$RUNNER_TEMP/job-began"
      - uses: actions/checkout@v4
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          # the errors, where they can be read without downloading anything
          { echo '### Compile errors'; echo '```'; grep -E "error:" ../build.log | sed -E 's#^.*/ios/##' | sort -u | head -60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "BUILD SUCCEEDED" ../build.log
      # The simulator tap-through takes most of the run; a design branch gets the
      # compile check only. design/integration is the one version the owner gets,
      # so it runs the full suite on every push: a failure there is never hidden.
      #
      # What a stuck test may cost, so a failure shows by name instead of
      # eating the job:
      # - grep --line-buffered: each Test Case line reaches the log as it
      #   happens (a plain grep in a pipe holds its output in a block, and on
      #   23 Oct the cancel threw that block away: no Test Case line at all);
      # - XCTest's own limit per test, 16 minutes (the longest passing test,
      #   testDepthMeasure, took 12.6 before T0164 split it in three; the million proof tests wait up to 15
      #   for their map and then fail by name), so a test that hangs is
      #   stopped and named and the suite goes on;
      # - this step's limit is under the job's, so the summary and the
      #   upload after it still run when it is reached.
      - name: Tap through sign-in and the terms on a simulator
        id: ui
        if: ${{ (!startsWith(github.ref_name, 'design/') || github.ref_name == 'design/integration') }}
        timeout-minutes: 110
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build-sim \
            -resultBundlePath ../ui.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 960 \
            -maximum-test-execution-time-allowance 960 \
            -skip-testing:RedPenUITests/AccessibilityUITests \
            -skip-testing:RedPenUITests/A11yProbeUITests \
            test 2>&1 | tee ../uitest.log | grep --line-buffered -E "error:|Test Case|TEST |\*\* " || true
          grep -q "TEST SUCCEEDED" ../uitest.log
      # The app's own standard output (its QUIZSET-CHANGE, POP-GESTURE and
      # POP-END trace lines under -uiPreviewScreen) is not in uitest.log:
      # XCTest keeps it in ui.xcresult as the diagnostic
      # "StandardOutputAndStandardError-com.cramdown.app.txt" (run
      # 41876986518). Its trace lines are copied to the end of uitest.log.
      - name: The app's trace lines from the UI run
        if: ${{ always() && steps.ui.outcome != 'skipped' }}
        run: |
          [ -d ui.xcresult ] || { echo 'no ui.xcresult'; exit 0; }
          rm -rf ui-diag
          xcrun xcresulttool export diagnostics --path ui.xcresult --output-path ui-diag || true
          {
            echo '=== APP-TRACE (StandardOutputAndStandardError-com.cramdown.app.txt in ui.xcresult)'
            find ui-diag -name 'StandardOutputAndStandardError-*.txt' -print0 2>/dev/null \
              | xargs -0 grep -hE "^(QUIZSET-CHANGE|POP-GESTURE|POP-END|HANG-WATCH) " 2>/dev/null || echo 'no trace lines found'
          } | tee -a uitest.log
          rm -rf ui-diag
      # its own step, so it is written also when the step above ran out of time
      - name: Summary of the tap-through
        if: ${{ always() && steps.ui.outcome != 'skipped' }}
        run: |
          {
            echo '### Sign-in and terms tap test'
            echo '```'
            if [ -f uitest.log ]; then
              # every failure, then the last tests run (the one running at a timeout among them)
              grep -E "error:" uitest.log | sed -E 's#^.*/ios/##' | head -40 || true
              grep -E "Test Case|TEST (SUCCEEDED|FAILED)" uitest.log | tail -20 || true
            else
              echo 'no uitest.log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The accessibility walk and audit at the largest text size: an audit
      # finding shows up here, in the summary, and as a red run. It must pass before the App
      # Store accessibility labels are claimed (docs/launch/accessibility.md).
      # Like the tap-through, it runs on personal and design/integration. A failure
      # here turns the run red: a green run must mean every check passed.
      - name: Accessibility at the largest text size
        id: a11y
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (!startsWith(github.ref_name, 'design/') || github.ref_name == 'design/integration') }}
        timeout-minutes: 30
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build-sim \
            -resultBundlePath ../a11y.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 480 \
            -only-testing:RedPenUITests/AccessibilityUITests \
            -only-testing:RedPenUITests/A11yProbeUITests \
            test 2>&1 | tee ../a11y.log | grep --line-buffered -E "error:|Test Case|TEST |\*\* |PROBE-" || true
          grep -q "TEST SUCCEEDED" ../a11y.log
      - name: Summary of the accessibility run
        if: ${{ always() && steps.a11y.outcome != 'skipped' }}
        run: |
          {
            echo '### Accessibility (AX5 text, audit)'
            echo '```'
            if [ -f a11y.log ]; then
              grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" a11y.log | tail -30 || true
            else
              echo 'no a11y.log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # When the app dies under the UI tests or the audit, no log says why: in
      # run 42024778055 it ended 14 s into the audit and XCTest only logged
      # "Checking for crash reports corresponding to unexpected termination of
      # com.cramdown.app". macOS writes the report on the Mac. This step copies
      # every report of the app's process written since the job began, from
      # the Mac's DiagnosticReports and each simulator's, into crash-reports/
      # (uploaded with ui-test), and prints a few APP-CRASH lines per report
      # (tools/crash_summary.py). The process is RedPen: target RedPen sets no
      # PRODUCT_NAME, so the build links RedPen.app/RedPen. With no report it
      # prints one line. It never fails the job: set +e, every command guarded,
      # continue-on-error, and a limit that leaves the upload its time.
      - name: Crash reports of the app
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
          A11Y_OUTCOME: ${{ steps.a11y.outcome }}
        run: |
          set +e
          out=crash-reports
          mkdir -p "$out"
          if [ -f "$RUNNER_TEMP/job-began" ]; then since=(-newer "$RUNNER_TEMP/job-began"); else since=(-mmin -180); fi
          # the APP-CRASH lines of the reports given, in the log and the run's summary
          summarise() {
            python3 -I tools/crash_summary.py "$@" > "$RUNNER_TEMP/crash-summary.txt" 2>&1 \
              || echo 'APP-CRASH tools/crash_summary.py did not run' >> "$RUNNER_TEMP/crash-summary.txt"
            cat "$RUNNER_TEMP/crash-summary.txt"
            { echo '### Crash reports of the app'; echo '```'; cat "$RUNNER_TEMP/crash-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          # <process>-<date>.ips, the legacy <process>_<date>_<host>.crash, a
          # fault the app survived (ExcUserFault_<process>-<date>.ips) and a
          # CPU limit report (<process>.cpu_resource-<date>.ips, or .diag)
          host=()
          for dir in "$HOME/Library/Logs/DiagnosticReports" \
                     "$HOME"/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] || continue
            while IFS= read -r -d '' f; do
              name=$(basename "$f")
              [ -e "$out/$name" ] && continue
              cp -p "$f" "$out/$name" 2>/dev/null && host+=("$out/$name")
            done < <(find "$dir" -maxdepth 2 -type f \( -name 'RedPen[-_]*.ips' -o -name 'RedPen[-_]*.crash' \
              -o -name 'ExcUserFault_RedPen[-_]*.ips' -o -name 'RedPen.cpu_resource[-_]*' \) "${since[@]}" -print0 2>/dev/null)
          done
          if [ ${#host[@]} -gt 0 ]; then
            summarise "${host[@]}"
          else
            echo 'APP-CRASH none: no crash report of RedPen (com.cramdown.app) on the Mac or its simulators since the job began'
          fi
          # The result bundles' diagnostics, where XCTest may keep the crash log
          # it looked for, go into the same folder. Best-effort: what export
          # diagnostics holds varies with the Xcode version, and its failure is
          # ignored. Only when the run may hold a crash (a report above, a red
          # or cut-off test step, a log naming an unexpected end), so a green
          # run takes a few seconds; the a11y bundle first, as the smaller.
          suspect=
          [ ${#host[@]} -gt 0 ] && suspect=1
          case " $UI_OUTCOME $A11Y_OUTCOME " in *" failure "*|*" cancelled "*) suspect=1 ;; esac
          grep -qsE 'unexpected termination|crashed' uitest.log a11y.log && suspect=1
          [ -n "$suspect" ] || exit 0
          for b in a11y ui; do
            [ -d "$b.xcresult" ] || continue
            rm -rf "$out/$b-diagnostics"
            xcrun xcresulttool export diagnostics --path "$b.xcresult" --output-path "$out/$b-diagnostics" > /dev/null 2>&1 || true
          done
          # The app's crash logs among them are summarised only when the Mac had
          # none (else they are most likely the same crash again), once a name.
          [ ${#host[@]} -gt 0 ] && exit 0
          bundled=(); seen=/
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            case "$seen" in *"/$name/"*) continue ;; esac
            grep -qsE '"(procName|app_name|name)" ?: ?"RedPen"|^Process: +RedPen \[' "$f" || continue
            seen="$seen$name/"; bundled+=("$f")
          done < <(find "$out" -mindepth 2 -type f \( -name '*.ips' -o -name '*.crash' \) -print0 2>/dev/null)
          [ ${#bundled[@]} -gt 0 ] && summarise "${bundled[@]}"
          exit 0
      # the logs go with the result bundles: a bundle cut off by a time limit
      # has no summary of its own, and the log says which test was running
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test
          path: |
            ui.xcresult
            a11y.xcresult
            uitest.log
            a11y.log
            crash-reports
          if-no-files-found: ignore
