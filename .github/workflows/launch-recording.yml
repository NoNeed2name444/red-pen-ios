# A screen recording of the app's opening (LaunchSplash), in light and dark,
# from the tap on the icon to the home screen: the system launch screen, the
# heartbeat, the ECG and the hand-off into home.
#
# The simulator records no sound, so the raw films land silent on the
# launch-recordings branch (runs/<run id>/); the heartbeat is laid in
# afterwards, timed from the first frame the ECG shows in (tools/launch_film.py).
#
# Light and dark record on two machines at once (a matrix), each from its own
# build, so the pair takes one run's time rather than two.
#
# Runs on a push to design/launch-anim that touches the opening, or by hand.
name: Launch recording
on:
  workflow_dispatch:
  push:
    branches: ['design/launch-anim']
    paths:
      - 'ios/RedPen/Shared/LaunchSplash.swift'
      - 'ios/RedPen/Shared/LaunchOpening.swift'
      - 'ios/RedPen/Shared/LaunchStage.swift'
      - 'ios/RedPen/Shared/Ward/WardSurfaces.swift'
      - 'ios/RedPen/Features/Library/WardHome.swift'
      - 'ios/RedPen/Features/Library/LibraryView.swift'
      - 'ios/RedPen/Assets.xcassets/LaunchLogo*/**'
      - 'ios/RedPen/Assets.xcassets/Heartbeat.dataset/**'
      - 'ios/RedPen/Assets.xcassets/AppIcon.appiconset/**'
      - 'ios/AppResources/AppIcon.icon/**'
      - '.github/workflows/launch-recording.yml'
permissions:
  contents: write
concurrency:
  group: launch-recording-${{ github.ref }}
  cancel-in-progress: true
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        mode: [light, dark]
    name: record (${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # no token in .git/config while the build runs package plugins
        with:
          persist-credentials: false

      - name: Tools
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          candidates = []
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-") if x.isdigit())
              for d in devs:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name:
                      continue
                  candidates.append(((version, name.endswith("Pro"), "Pro" in name, name), d["udid"], name))
          candidates.sort()
          if not candidates:
              raise SystemExit("no iPhone simulator on this runner")
          _, udid, name = candidates[-1]
          print(f"udid={udid}")
          print("picked", name, file=sys.stderr)
          PY

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          grep -q "BUILD SUCCEEDED" ../build.log

      - name: Record the opening
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          MODE: ${{ matrix.mode }}
        run: |
          set -e
          APP="ios/build/Build/Products/Debug-iphonesimulator/RedPen.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 \
            --batteryState charged --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$UDID" appearance "$MODE"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p film
          T="film/timing-$MODE.txt"
          stamp() { echo "$(date -u +%H:%M:%S.%N | cut -c1-12) $*  | load $(sysctl -n vm.loadavg)" >> "$T"; }
          stamp "booted and installed"
          # one launch first, unrecorded: the first launch after install
          # spends seconds on caches that no real opening does
          stamp "warm-up launch"
          xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen library -uiPreviewSplash >/dev/null
          sleep 8
          # what the app measured of the hand-off (LaunchStage.writeReadout):
          # read back after each take, and cleared before the next
          readout() {
            local data
            data=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null || true)
            [ -n "$data" ] || return 0
            if [ "$1" = clear ]; then rm -f "$data/Library/Caches/launch-handoff.txt"; return 0; fi
            if [ -f "$data/Library/Caches/launch-handoff.txt" ]; then
              echo "take $1: $(cat "$data/Library/Caches/launch-handoff.txt")" >> "film/handoff-$MODE.txt"
            else
              echo "take $1: no readout" >> "film/handoff-$MODE.txt"
            fi
          }
          # two recorded launches: the film is the first; the second shows
          # whether a slow first one was the machine settling after boot. A
          # take whose recording came out empty (the recorder can fail on a
          # busy runner) is taken again, up to twice.
          for take in 1 2; do
            name="film/raw-$MODE.mp4"; [ $take = 2 ] && name="film/raw-$MODE-2.mp4"
            for attempt in 1 2 3; do
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              sleep 3
              readout clear
              xcrun simctl io "$UDID" recordVideo --codec=h264 --mask=black --force "$name" &
              REC=$!
              sleep 3
              stamp "take $take (attempt $attempt): launch (3 s into $name)"
              xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen library -uiPreviewSplash >> "film/launch-$MODE.log" 2>&1
              # a Debug build on a busy runner can sit on the launch screen ~10 s
              sleep 20
              kill -INT $REC
              wait $REC || true
              size=$(stat -f %z "$name" 2>/dev/null || echo 0)
              if [ "$size" -gt 200000 ]; then break; fi
              stamp "take $take (attempt $attempt): recording empty ($size bytes), taking again"
            done
            readout $take
          done
          # the splash's first frame against the system launch screen, as
          # lossless screenshots: launched holding the first frame (marked
          # with a red square), shot each second while it starts (the launch
          # screen) and again once the held splash is up
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          sleep 3
          xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen library -uiPreviewSplash -uiPreviewSplashHold >/dev/null
          for i in 1 2 3 4 5 6; do
            sleep 1
            xcrun simctl io "$UDID" screenshot --type=png "film/ground-$MODE-$i.png" >/dev/null 2>&1 || true
          done
          sleep 12
          xcrun simctl io "$UDID" screenshot --type=png "film/ground-$MODE-held.png" >/dev/null 2>&1 || true
          stamp "done"
          ls -la film
          cat "film/handoff-$MODE.txt"

      - name: Judge the hand-off
        env:
          MODE: ${{ matrix.mode }}
        run: |
          # the longest the main thread was held up between the hand-off and
          # home being still, per take: over 100 ms is a visible hitch
          f="film/handoff-$MODE.txt"
          [ -f "$f" ] || { echo "::error::no hand-off readout"; exit 1; }
          bad=0
          while read -r line; do
            gap=$(echo "$line" | sed -nE 's/.*gap_ms=([0-9]+).*/\1/p')
            if [ -z "$gap" ]; then echo "::error::$MODE $line"; bad=1
            elif [ "$gap" -gt 100 ]; then echo "::error::$MODE hand-off held up ${gap} ms: $line"; bad=1
            else echo "$MODE ok: $line"; fi
          done < "$f"
          exit $bad

      - name: Keep the build log
        if: always()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p film
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -40 > "film/errors-$MODE.txt" || true
          # the asset compiler on the icon and the launch art: any complaint at all
          grep -iE "actool|AppIcon|LaunchLogo|Heartbeat|\.icon" build.log 2>/dev/null \
            | grep -iE "warning|error|note" | sed -E 's#^.*/ios/##' | sort -u | head -40 > "film/assets-$MODE.txt" || true
          # the compiled icon as the build made it, to look at (once is enough)
          if [ "$MODE" = light ]; then
            find ios/build -name "AppIcon*.png" -path "*RedPen.app*" -exec cp {} film/ \; 2>/dev/null || true
          fi

      - name: Publish
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls film/* >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          # the other mode's job publishes to the same branch, maybe at the
          # same moment: start again from the branch's tip until the push lands
          for attempt in 1 2 3 4 5; do
            dest="$RUNNER_TEMP/results-$attempt"
            if git fetch -q "$remote" launch-recordings; then
              git worktree add -q "$dest" FETCH_HEAD && git -C "$dest" checkout -q -B launch-recordings
            else
              git worktree add -q --detach "$dest" && git -C "$dest" checkout -q --orphan launch-recordings
              git -C "$dest" rm -rqf --cached . > /dev/null 2>&1 || true
              find "$dest" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
            mkdir -p "$dest/runs/${{ github.run_id }}"
            cp film/* "$dest/runs/${{ github.run_id }}/"
            git -C "$dest" add runs
            git -C "$dest" commit -q -m "Launch recording ${{ github.run_id }} ${{ matrix.mode }} (${{ github.sha }})"
            if git -C "$dest" push -q "$remote" launch-recordings; then
              echo "runs/${{ github.run_id }} on launch-recordings (${{ matrix.mode }})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
