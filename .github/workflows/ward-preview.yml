# A short look at the Ward design pass, light and dark, without the whole
# design tour: home, a study screen, New set, Settings and a sheet over home,
# each section's screen in its hue, in both modes on an iPhone, home at the
# iPhone SE's 375-point width, and recordings of the colour shift: the app's
# own light/dark switch, home stepping through its sections, and the
# system's switch. A picture that is still the launch screen is taken again,
# and the run fails if any frame of the app's own switch has faded
# (tools/ward_frames_check.py: content or status bar contrast under both
# end states).
#
# A push to a preview/ward-<name> branch runs it (design-preview.yml leaves
# those branches alone); the pictures land on the shots/ward-<name> branch.
# Each name is pushed once, so a later round takes a new name.
name: Ward preview
on:
  push:
    branches: ['preview/ward-**']
permissions:
  contents: read
concurrency:
  group: ward-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          candidates = []
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-") if x.isdigit())
              for d in devs:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name:
                      continue
                  candidates.append(((version, name.endswith("Pro"), "Pro" in name, name), d["udid"], name))
          candidates.sort()
          _, udid, name = candidates[-1]
          print(f"udid={udid}")
          print("picked", name, file=sys.stderr)
          PY
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          grep -q "BUILD SUCCEEDED" ../build.log
      - name: Pictures and the recording
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP="ios/build/Build/Products/Debug-iphonesimulator/RedPen.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged \
            --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p out/shots
          # Whether a picture is still the launch screen: flat above and below
          # the logo. sips turns it into an uncompressed BMP to read.
          cat > blank.py <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          off, = struct.unpack_from("<I", d, 10)
          w, h = struct.unpack_from("<ii", d, 18)
          bpp, = struct.unpack_from("<H", d, 28)
          step = bpp // 8; row = (w * step + 3) & ~3; up = h > 0; h = abs(h)
          def spread(top, bottom):  # rows as a share of the picture, from its top
              vals = []
              for r in range(int(h * top), int(h * bottom), 7):
                  y = h - 1 - r if up else r
                  for x in range(w // 8, 7 * w // 8, 5):
                      i = off + y * row + x * step
                      vals.append(0.2126 * d[i + 2] + 0.7152 * d[i + 1] + 0.0722 * d[i])
              m = sum(vals) / len(vals)
              return (sum((v - m) ** 2 for v in vals) / len(vals)) ** 0.5
          # the launch screen: one flat colour above and below its logo
          print("blank" if spread(0.12, 0.38) < 3 and spread(0.7, 0.9) < 3 else "ok")
          PY
          shoot() {  # mode, screen, file name, extra launch arguments
            local mode="$1" screen="$2" name="$3" try
            shift 3
            xcrun simctl ui "$UDID" appearance "$mode"
            for try in 1 2 3; do
              xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen "$screen" "$@" >> out/shots.log 2>&1 \
                || echo "launch failed: $name" >> out/shots.log
              sleep $((10 + 6 * try))
              xcrun simctl io "$UDID" screenshot --type=png --mask=alpha "out/shots/$name.png" >> out/shots.log 2>&1 \
                || echo "shot failed: $name" >> out/shots.log
              pgrep -f "RedPen.app/RedPen" >/dev/null || echo "not running after: $name" >> out/shots.log
              sips -s format bmp "out/shots/$name.png" --out shot.bmp >/dev/null 2>&1 || break
              [ "$(python3 blank.py shot.bmp)" = ok ] && break
              echo "still the launch screen, try $try: $name" >> out/shots.log
            done
          }
          record() {  # screen, file, seconds to wait, seconds to record
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen "$1" >> out/shots.log 2>&1
            sleep "$3"
            xcrun simctl io "$UDID" recordVideo --codec=h264 --mask=black "out/$2" &
            REC=$!
            sleep "$4"
            kill -INT $REC
            wait $REC || true
          }
          # a first launch on a fresh simulator brings a system banner over
          # the top of the screen for a few seconds; let it come and go
          # before anything is recorded
          xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen library >> out/shots.log 2>&1
          sleep 12
          # the app's own switch first (Always night sky turning the window
          # dark and back every 2.5 s), then home stepping along its dock
          record mode-switch mode-switch-app.mp4 6 11
          record mode-switch-quiz mode-switch-quiz.mp4 6 11
          record section-switch section-switch.mp4 5 13
          for mode in light dark; do
            for screen in library quiz new settings sheet; do
              shoot "$mode" "$screen" "$screen-$mode"
            done
            shoot "$mode" library "library-se-$mode" -uiPreviewWidth 375
            # each section in its hue: Cards, Textbook, Cases, OSCE, Audio
            # and Ideas (Questions is the quiz above)
            for screen in anki book cases osce narrate home-ideas; do
              shoot "$mode" "$screen" "section-$screen-$mode"
            done
          done
          # home while the system turns dark and back
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BID" -uiPreviewScreen library >> out/shots.log 2>&1
          sleep 9
          xcrun simctl io "$UDID" recordVideo --codec=h264 --mask=black out/mode-switch.mp4 &
          REC=$!
          sleep 3
          for mode in dark light dark light; do
            xcrun simctl ui "$UDID" appearance "$mode"
            sleep 2.5
          done
          kill -INT $REC
          wait $REC || true
          for report in ~/Library/Logs/DiagnosticReports/RedPen*.ips; do
            [ -f "$report" ] && cp "$report" out/ && echo "crash report: $(basename "$report")" >> out/shots.log
          done
          for f in out/shots/*.png; do sips --resampleWidth 600 "$f" --out "$f" >/dev/null || true; done
          ls -la out out/shots
      - name: Keep the log
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -60 > out/errors.txt || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ward-preview
          path: out
  publish:
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ward-preview
          path: out
      - uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false
          sparse-checkout: tools/ward_frames_check.py
          sparse-checkout-cone-mode: false
      - name: Check the light/dark switch for a fade
        id: fade
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg python3-pil >/dev/null
          set +e
          code=0
          for v in mode-switch-app mode-switch-quiz; do
            [ -f "out/$v.mp4" ] || continue
            echo "== $v" >> out/frames-check.txt
            python3 src/tools/ward_frames_check.py "out/$v.mp4" --report out/check.tmp
            [ $? = 1 ] && code=1
            cat out/check.tmp >> out/frames-check.txt && rm out/check.tmp
          done
          # the system's own switch, for the record only: iOS blends the
          # screen across itself when the whole device changes mode
          if [ -f out/mode-switch.mp4 ]; then
            echo "== mode-switch (system, not gated)" >> out/frames-check.txt
            python3 src/tools/ward_frames_check.py out/mode-switch.mp4 >> out/frames-check.txt
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Push to shots/ward-<name>
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          NAME="${REF#preview/}"
          cd out
          git init -q
          git checkout -q -b "shots/$NAME"
          git config user.name "red-pen-preview"
          git config user.email "preview@users.noreply.github.com"
          git add -A
          git commit -q -m "Ward preview of ${GITHUB_SHA::7}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots/$NAME:shots/$NAME"
      - name: Fail on a faded frame
        if: ${{ steps.fade.outputs.code == '1' }}
        run: |
          cat out/frames-check.txt
          exit 1
