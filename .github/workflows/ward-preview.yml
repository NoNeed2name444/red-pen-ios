# A short look at the Ward design pass, light and dark, without the whole
# design tour, on two Macs at once (tools/ward_shots.sh says what each
# takes): on the main iPhone (a 17 Pro), the recordings of the colour shift
# (the app's own light/dark switch, home stepping through its sections, the
# system's switch), home, a study screen, New set, Settings, a sheet and
# each section in both modes, home and each section at the iPhone SE's
# size, and Dynamic Type at XXL and AX1; on the second, home and each
# section on a Pro Max and an iPad, both modes, and home at XXL. A picture
# that is still the launch screen is taken again. Pictures are kept at full
# size, to be read at 1:1.
#
# The run fails if any frame of the app's own switch has faded
# (tools/ward_frames_check.py: content or status bar contrast under both
# end states), or if home's round card or its button runs under the bar or
# New set sits on the card on any device or size (HomeFit, written by the
# app on the "library" screen).
#
# A push to a preview/ward-<name> branch runs it (design-preview.yml leaves
# those branches alone); the pictures land on the shots/ward-<name> branch.
# Each name is pushed once, so a later round takes a new name.
name: Ward preview
on:
  push:
    branches: ['preview/ward-**']
permissions:
  contents: read
concurrency:
  group: ward-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [phone, devices]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Pick the simulators
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          best = {}
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1]))
              for d in devs:
                  name = d["name"]
                  if name.startswith("iPhone") and "SE" not in name:
                      # the main phone: a Pro, not a Max; then the Pro Max
                      key = "max" if name.endswith("Pro Max") else ("pro" if name.endswith(" Pro") else None)
                      rank = 0
                  elif name.startswith("iPad"):
                      # an 11-inch iPad Pro, else any iPad Pro, else any iPad
                      key = "ipad"
                      rank = 2 if name.startswith("iPad Pro") and "11" in name else (1 if name.startswith("iPad Pro") else 0)
                  else:
                      continue
                  if key is None:
                      continue
                  candidate = (version, rank, name, d["udid"])
                  if key not in best or candidate > best[key]:
                      best[key] = candidate
          for key in ("pro", "max", "ipad"):
              if key in best:
                  print(f"{key}={best[key][3]}")
                  print(key, best[key][2], file=sys.stderr)
              else:
                  print("no simulator for", key, file=sys.stderr)
          PY
      - name: Build for the simulator
        working-directory: ios
        env:
          UDID: ${{ matrix.part == 'phone' && steps.sim.outputs.pro || steps.sim.outputs.max }}
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          grep -q "BUILD SUCCEEDED" ../build.log
      - name: Pictures and recordings on the iPhone
        if: matrix.part == 'phone'
        env:
          UDID: ${{ steps.sim.outputs.pro }}
        run: bash tools/ward_shots.sh phone "$UDID" ios/build/Build/Products/Debug-iphonesimulator/RedPen.app
      - name: Pictures on the Pro Max and the iPad
        if: matrix.part == 'devices'
        env:
          MAX: ${{ steps.sim.outputs.max }}
          IPAD: ${{ steps.sim.outputs.ipad }}
        run: |
          APP=ios/build/Build/Products/Debug-iphonesimulator/RedPen.app
          mkdir -p out/devices
          if [ -n "$MAX" ]; then bash tools/ward_shots.sh device "$MAX" "$APP" promax; else echo "FAULT no Pro Max simulator" >> out/devices/home-fit.txt; fi
          if [ -n "$IPAD" ]; then bash tools/ward_shots.sh device "$IPAD" "$APP" ipad; else echo "FAULT no iPad simulator" >> out/devices/home-fit.txt; fi
      - name: Keep the log
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out out/devices
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -60 > "out/errors-${{ matrix.part }}.txt" || true
          ls -laR out | head -150
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ward-${{ matrix.part }}
          path: out
  publish:
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ward-phone
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ward-devices
          path: devices-out
      - name: Put the devices' pictures beside the iPhone's
        run: |
          mkdir -p out/devices
          if [ -d devices-out/devices ]; then cp -R devices-out/devices/. out/devices/; else echo "FAULT the devices' job left nothing" >> out/devices/home-fit.txt; fi
          cp devices-out/errors-devices.txt out/ 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false
          sparse-checkout: tools/ward_frames_check.py
          sparse-checkout-cone-mode: false
      - name: Check the light/dark switch for a fade
        id: fade
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg python3-pil >/dev/null
          set +e
          code=0
          for v in mode-switch-app mode-switch-quiz; do
            if [ ! -f "out/$v.mp4" ]; then
              echo "== $v: no recording" >> out/frames-check.txt
              code=1
              continue
            fi
            echo "== $v" >> out/frames-check.txt
            python3 src/tools/ward_frames_check.py "out/$v.mp4" --report out/check.tmp
            # a fade fails, and so does a recording with no switch in it
            # (r9's stayed dark throughout and passed)
            [ $? != 0 ] && code=1
            cat out/check.tmp >> out/frames-check.txt && rm out/check.tmp
          done
          # the system's own switch, for the record only: iOS blends the
          # screen across itself when the whole device changes mode
          if [ -f out/mode-switch.mp4 ]; then
            echo "== mode-switch (system, not gated)" >> out/frames-check.txt
            python3 src/tools/ward_frames_check.py out/mode-switch.mp4 >> out/frames-check.txt
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Push to shots/ward-<name>
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          NAME="${REF#preview/}"
          cd out
          git init -q
          git checkout -q -b "shots/$NAME"
          git config user.name "red-pen-preview"
          git config user.email "preview@users.noreply.github.com"
          git add -A
          git commit -q -m "Ward preview of ${GITHUB_SHA::7}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots/$NAME:shots/$NAME"
      - name: Fail on a faded frame or a recording with no switch
        if: ${{ steps.fade.outputs.code == '1' }}
        run: |
          cat out/frames-check.txt
          exit 1
      - name: Fail on a home that does not fit, on any device or size
        run: |
          cat out/home-fit.txt 2>/dev/null || { echo "no home-fit.txt"; exit 1; }
          cat out/devices/home-fit.txt 2>/dev/null || { echo "no devices/home-fit.txt"; exit 1; }
          ! grep -q "^FAULT" out/home-fit.txt out/devices/home-fit.txt
