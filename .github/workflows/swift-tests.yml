# The app's pure-Swift logic, compiled and RUN - not just type-checked. A suite
# that compiles and never executes is a suite that passes forever.
#
# Swift allows top-level statements only in a file named main.swift, and only
# one per binary, so each suite is copied to its own build directory under that
# name. Copying it to any other name is what made an earlier suite silently
# never compile.
#
# Only UIKit-free files can be listed: the runner is a Mac, so a file importing
# UIKit, PDFKit, StoreKit or Vision cannot be compiled for it. That is why the
# decisions worth testing live in files that import nothing but Foundation.
name: Swift tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/RedPen/Shared/**'
      - 'ios/RedPen/Models/**'
      - 'ios/RedPen/Features/Anki/AnkiScheduler.swift'
      - 'ios/RedPen/Features/Notes/GraphUniverse.swift'
      - 'ios/RedPen/Features/Notes/GraphLinkCurve.swift'
      - 'ios/RedPen/Features/Notes/GraphThemePlan.swift'
      - 'ios/RedPen/Features/Notes/GraphNeurons.swift'
      - 'ios/RedPen/Features/Notes/GraphNeuronImpulses.swift'
      - 'ios/RedPen/Features/Notes/GraphTheme.swift'
      - 'ios/RedPen/Features/Notes/GraphCircuit.swift'
      - 'ios/RedPen/Tests/**'
      - '.github/workflows/swift-tests.yml'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # A real zip for the Word reader to open, written by the runner's own zip
      # command rather than by Red Pen: the whole risk in reading a .docx is
      # that a real file is laid out differently from the one in your head.
      - name: A sample Word handout
        run: |
          mkdir -p fixture/word/media
          printf '%s' '<?xml version="1.0"?><w:document xmlns:w="x"><w:body><w:p><w:r><w:t>Lupus &amp; the kidney</w:t></w:r></w:p><w:p><w:r><w:t>Class IV</w:t></w:r><w:r><w:t> nephritis</w:t></w:r></w:p><w:p/><w:p><w:r><w:t>Treat with</w:t></w:r><w:br/><w:r><w:t>steroids</w:t></w:r></w:p></w:body></w:document>' > fixture/word/document.xml
          printf 'two' > fixture/word/media/image2.png
          printf 'ten' > fixture/word/media/image10.png
          (cd fixture && zip -qr ../sample.docx .)

      - name: Every suite
        run: |
          mkdir -p out
          S=ios/RedPen/Shared; M=ios/RedPen/Models; F=ios/RedPen/Features
          suite () {
            name=$1; test=$2; shift 2
            mkdir -p build/$name
            cp ios/RedPen/Tests/$test build/$name/main.swift
            {
              swiftc -O "$@" build/$name/main.swift -o build/$name/run 2>&1 | head -n 40
              echo "compile rc=${PIPESTATUS[0]}"
              if [ -x build/$name/run ]; then
                build/$name/run 2>&1 | head -n 90; echo "run rc=${PIPESTATUS[0]}"
              else echo "$name was never built"; fi
            } > out/$name.log 2>&1
            cat out/$name.log
          }
          # the exam-day forecast and exam cap, lock it in, exam week, symptom
          # blocks, guess first and the daily rhythm
          suite learn LearnTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift \
                $F/Anki/AnkiScheduler.swift $S/ReviewPlan.swift $S/ExamTrack.swift \
                $S/Insight/InsightModels.swift $S/Learn/RetentionForecast.swift $S/Learn/SecuredRule.swift \
                $S/Learn/ExamWeekPlanner.swift $S/Learn/SymptomBlocks.swift $S/Learn/Pretest.swift \
                $S/Learn/StudyRhythm.swift
          # exam tools: mock paper assembly and marking, the twin queue, the
          # attending's hint that never names the answer, calculator, lab ranges
          suite examtools ExamToolsTests.swift $M/MCQQuestion.swift $M/Differential.swift $S/ExamTrack.swift \
                $S/Exam/MockPaper.swift $S/Exam/TwinQueue.swift $S/Exam/AttendingHint.swift $S/Exam/ExamTools.swift
          suite quality CardQualityTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift \
                $S/CardQuality.swift $S/QuizFromCards.swift
          suite learning LearningTests.swift $S/SoundKey.swift $S/PronunciationStore.swift \
                $S/OnDeviceLearning.swift $S/Corrections.swift $S/WordTiming.swift
          suite transcriber TranscriberTests.swift $S/SoundKey.swift $S/PronunciationStore.swift \
                $S/OnDeviceLearning.swift $S/Corrections.swift $S/WordTiming.swift \
                $S/LectureTranscriber.swift $S/Brand.swift
          suite cloudtranscript CloudTranscriptTests.swift $S/CloudTranscript.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift \
                $S/Corrections.swift $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift
          suite ingest IngestTests.swift $S/SourceText.swift
          suite narrate NarrateTests.swift $S/NarratePlan.swift
          suite figures FigureTests.swift $M/AnkiCard.swift $S/FigureGrid.swift
          suite docx DocxTests.swift $S/Zip.swift $S/DocxText.swift
          # hostile archives built byte by byte: size fields that lie, one
          # stream under ten thousand names, a stream that never ends; and
          # Word's tracked changes, field codes and doubled text boxes
          suite zip ZipTests.swift $S/Zip.swift $S/DocxText.swift $S/PptxText.swift
          # pasted text with Windows line endings, answer letters, a set
          # shared from another phone, Anki's fields and the .apkg's zip
          suite imports ImportTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift \
                $M/QACard.swift $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift $M/StudySet.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift \
                $S/Corrections.swift $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/PlainTextImport.swift $S/SetImport.swift $S/BookFigures.swift $S/BookPages.swift \
                $S/AnkiFields.swift $S/MiniZip.swift $S/Zip.swift
          suite coverage CoverageTests.swift $S/MCQCoverage.swift
          suite schedule ScheduleTests.swift $M/AnkiCard.swift \
                $F/Anki/AnkiScheduler.swift $S/ReviewPlan.swift
          suite slides SlideTests.swift $M/AnkiCard.swift $M/MCQQuestion.swift $M/Differential.swift \
                $S/DocxText.swift $S/PptxText.swift $S/SourceText.swift \
                $S/MCQCoverage.swift $S/Provenance.swift $S/MCQEdit.swift
          suite account AccountTests.swift $M/Account.swift $S/AuthRules.swift \
                $S/Entitlement.swift
          # the merge, picture references, what the server will take, a
          # newer version's document, and what becomes of a cloud job
          suite sync SyncTests.swift $M/SyncDoc.swift $S/SyncMerge.swift $S/BlobRefs.swift \
                $S/SyncRules.swift $S/CloudJobRules.swift
          suite sources SourceTests.swift $M/SourceDoc.swift $S/SourceSearch.swift
          # NarrateSegment carries a helper that builds segments from a
          # transcript, so the parsers drag the transcriber in with them.
          suite osce OsceTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift \
                $M/QACard.swift $M/OsceChecklist.swift $M/NarrateSegment.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift \
                $S/Corrections.swift $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/PlainTextImport.swift $S/OsceStations.swift $S/ExamTrack.swift
          # the model layer's text handling: MedVAL's prompt and grade, JSON
          # out of prose, and which part of a lecture a check reads
          suite llm LLMTests.swift $S/LLM/LLMCore.swift $S/LLM/LLMParsing.swift
          suite reading ReadingTests.swift $S/Highlight.swift $S/BookPages.swift $S/BookFigures.swift
          suite deck DeckTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift $M/QACard.swift \
                $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift \
                $M/StudySet.swift $S/SoundKey.swift $S/PronunciationStore.swift \
                $S/OnDeviceLearning.swift $S/Corrections.swift $S/WordTiming.swift \
                $S/LectureTranscriber.swift $S/Brand.swift $S/PlainTextImport.swift \
                $S/BookPages.swift $S/BookFigures.swift $S/Highlight.swift \
                $S/ImageSpoiler.swift $S/DeckPalette.swift $S/DeckCard.swift \
                $S/Explanation.swift
          suite occlusion OcclusionFilterTests.swift $M/AnkiCard.swift $S/FigureGrid.swift $S/OcclusionFilter.swift \
                $S/OcclusionPhrases.swift
          # one cover per label phrase, and the answer is what is under it
          suite phrases OcclusionPhraseTests.swift $M/AnkiCard.swift $S/OcclusionFilter.swift \
                $S/OcclusionPhrases.swift
          suite modeconversion ModeConversionTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift $M/QACard.swift \
                $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift $M/StudySet.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift $S/Corrections.swift \
                $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/BookPages.swift $S/BookFigures.swift $S/Highlight.swift \
                $S/CardQuality.swift $S/QuizFromCards.swift $S/ModeConversion.swift
          suite answers AnswerCheckingTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift $M/QACard.swift \
                $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift $M/StudySet.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift $S/Corrections.swift \
                $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/BookPages.swift $S/BookFigures.swift $S/Highlight.swift \
                $S/CardQuality.swift $S/QuizFromCards.swift $S/ModeConversion.swift $S/OptionOrder.swift \
                $S/Voice/SpokenAnswer.swift $S/Reasoning/ReasoningModels.swift $S/Reasoning/ReasoningExamples.swift \
                $S/Reasoning/ReasoningWriter.swift $S/LLM/LLMCore.swift $S/LLM/LLMParsing.swift $S/ExamTrack.swift
          # "How to reach it": the three-tier differential - old sets decode
          # without it, the tiers are read from a model's reply, and MedVAL's
          # grade reads the reasoning checks
          suite differential DifferentialTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift $M/QACard.swift \
                $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift $M/StudySet.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift $S/Corrections.swift \
                $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/BookPages.swift $S/BookFigures.swift $S/Highlight.swift \
                $S/CardQuality.swift $S/QuizFromCards.swift $S/ModeConversion.swift \
                $S/Reasoning/ReasoningModels.swift $S/Reasoning/ReasoningExamples.swift $S/Reasoning/ReasoningWriter.swift \
                $S/LLM/LLMCore.swift $S/LLM/LLMParsing.swift $S/ExamTrack.swift $S/PlainTextImport.swift $S/OsceStations.swift
          # the Universe look: folders as black holes and stars, notes as planets,
          # moons, pulsars and comets - the size ladder, no overlaps, determinism
          suite cosmic CosmicHierarchyTests.swift $F/Notes/GraphUniverse.swift
          # the Graphics setting (Automatic / High quality / Smooth), even
          # frame steps, and every link one smooth curve
          suite graphics GraphicsTests.swift $S/Space/GraphicsQuality.swift $F/Notes/GraphLinkCurve.swift
          # the Neurons theme: folders as brain regions and relays down the
          # pathway, notes as neurons, glia and receptors - the ladder, no
          # overlaps, pathways running outward, impulses at random times
          suite neurons NeuronHierarchyTests.swift $F/Notes/GraphUniverse.swift $F/Notes/GraphThemePlan.swift \
                $F/Notes/GraphNeurons.swift $F/Notes/GraphNeuronImpulses.swift $F/Notes/GraphTheme.swift
          # the Circuit theme: folders as processors and module chips on their
          # sub-boards, notes as capacitors, resistors, LEDs, diodes, headers
          # and edge fingers - the ladder, no overlapping footprints, flat on
          # the board, and every trace routed square with rounded 45° corners
          suite circuit CircuitHierarchyTests.swift $F/Notes/GraphUniverse.swift $F/Notes/GraphThemePlan.swift \
                $F/Notes/GraphCircuit.swift $F/Notes/GraphLinkCurve.swift $F/Notes/GraphNeuronImpulses.swift \
                $F/Notes/GraphTheme.swift
          # the accuracy engine: dose, lab and contradiction rules (the same
          # cases as the server's), the accuracy model's grades, the cache key,
          # the order background checks run in, and one-tap corrections
          suite accuracy AccuracyTests.swift $M/MCQQuestion.swift $M/Differential.swift $M/AnkiCard.swift $M/QACard.swift \
                $M/OsceChecklist.swift $M/NarrateSegment.swift $M/SourceDoc.swift $M/StudySet.swift \
                $S/SoundKey.swift $S/PronunciationStore.swift $S/OnDeviceLearning.swift $S/Corrections.swift \
                $S/WordTiming.swift $S/LectureTranscriber.swift $S/Brand.swift \
                $S/BookPages.swift $S/BookFigures.swift $S/Highlight.swift \
                $S/Accuracy/AccuracyItem.swift $S/Accuracy/AccuracyRules.swift $S/Accuracy/AccuracyModel.swift \
                $S/Accuracy/AccuracyLedger.swift $S/Accuracy/AccuracySchedule.swift
          # crash and failure reports: nothing a student wrote can leave in
          # one, fingerprints match the server's, the queue's caps, unclean
          # exits, MetricKit's call stacks
          suite diagnostics DiagnosticsTests.swift $S/Diagnostics/DiagnosticsModel.swift \
                $S/Diagnostics/DiagnosticsQueue.swift $S/Diagnostics/Diagnostics.swift

      - name: Fail the job if anything failed
        run: |
          bad=0
          for f in out/*.log; do
            if grep -qE 'rc=[1-9]' "$f"; then echo "FAILURES in $f"; bad=1; fi
            if grep -q 'never built' "$f"; then echo "NOT BUILT in $f"; bad=1; fi
          done
          [ "$bad" = "0" ] && echo "every check passed"
          exit $bad

      - name: Push the logs
        if: always()
        run: |
          cd out
          git init -q && git checkout -q -b swift-tests
          git config user.name red-pen-preview && git config user.email preview@users.noreply.github.com
          git add -A && git commit -q -m "swift tests $GITHUB_RUN_ID" || git commit -q --allow-empty -m nothing
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" swift-tests:swift-tests
