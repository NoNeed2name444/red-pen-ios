# A build of the app for one person, not for the App Store: main plus a small
# patch (a this-device-only sign-in, everything unlocked, no sync). The patch
# is kept on the "personal" branch so main never carries it.
name: Personal build
on:
  workflow_dispatch:
    inputs:
      patch:
        description: xz-compressed, base64-encoded git diff against the personal branch (empty means just build)
        required: false
        default: ''
      sha256:
        description: sha256 of the decoded diff
        required: false
        default: ''
      message:
        description: commit message
        required: false
        default: Personal build change
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal
      - name: Apply the personal patch
        env:
          PATCH: ${{ inputs.patch }}
          SUM: ${{ inputs.sha256 }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail
          [ -z "$PATCH" ] && exit 0
          printf '%s' "$PATCH" | base64 -d | xz -d > /tmp/p.diff
          echo "$SUM  /tmp/p.diff" | shasum -a 256 -c -
          git apply /tmp/p.diff
          git config user.name "NoNeed2name444"
          git config user.email "79jvshtz2r@privaterelay.appleid.com"
          git add -A
          git commit -qm "$MSG"
          git push origin HEAD:personal
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Build for a device
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | grep -E "error:|BUILD |\*\* " || true
          grep -q "BUILD SUCCEEDED" ../build.log
      - name: Wrap it as an .ipa
        run: |
          set -euo pipefail
          APP=$(find ios/build/Build/Products -maxdepth 2 -name 'RedPen.app' -type d | head -1)
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry "CramDown-Personal.ipa" Payload && rm -rf Payload)
      - name: Record
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || true
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/ios/##' | sort -u | head -40 > out/errors.txt || true
      - name: Tap-test the sign-in on an iPad simulator
        if: ${{ !cancelled() }}
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPad Air')))")
          set -o pipefail
          xcodebuild test -project RedPen.xcodeproj -scheme RedPen -destination "id=$UDID" \
            -derivedDataPath build-sim -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ../out/uitest.xcresult 2>&1 | tee ../uitest.log | grep -E "error:|Test Case|TEST |\*\* " || true
          mkdir -p ../out && grep -E "error:|Test Case|failed|XCTAssert" ../uitest.log | tail -40 > ../out/uitest.txt || true
          grep -q "TEST SUCCEEDED" ../uitest.log && echo PASS >> ../out/uitest.txt || echo FAIL >> ../out/uitest.txt
          (cd ../out && zip -qry uitest.xcresult.zip uitest.xcresult && rm -rf uitest.xcresult) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-personal
          path: out/*
