# Screenshots for the owner to check the design before trying the app, on an
# iPhone simulator and an iPad simulator:
# - the 3D idea map at rest, a moment later, in landscape and mid-drag
#   (GraphPreviewUITests), with a screen recording of the iPhone's run;
# - a tour of the redesigned app (DesignTourUITests): the library on each of
#   the dock's categories, a category's tiles, New set, a quiz, a card, Ideas
#   in each view with its switcher open and folded, the menu, Settings and
#   Progress;
# - the first Arabic screens, right to left (ArabicUITests): sign-in, the
#   recording terms, the dock and Settings, named ar-*.
# A push to a preview/** branch runs it; the pictures land on the
# design-preview branch, in shots/iphone/ and shots/ipad/, with a README
# that shows them all on one page.
name: Design preview
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: design-preview
  cancel-in-progress: true
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        # no token left in .git/config for the build: the packages it
        # compiles (and their macros and plugins) run in later steps, and
        # the push step brings its own token
        with:
          persist-credentials: false
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Pick the simulators
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          phones, pads = [], []
          index = 0
          for runtime, devs in devices.items():
              if "iOS" not in runtime:
                  continue
              # the newest iOS first: the app needs iOS 26
              version = tuple(int(x) for x in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1]))
              for d in devs:
                  name = d["name"]
                  index += 1
                  if name.startswith("iPhone"):
                      # a Pro, as before; a Pro Max next; any iPhone last
                      rank = 2 if " Pro" in name and "Max" not in name else (1 if " Pro" in name else 0)
                      phones.append((tuple(-v for v in version), -rank, index, name, d["udid"]))
                  elif name.startswith("iPad"):
                      # the first iPad Pro, or else any iPad
                      rank = 1 if name.startswith("iPad Pro") else 0
                      pads.append((tuple(-v for v in version), -rank, index, name, d["udid"]))
          phones.sort()
          pads.sort()
          if not phones:
              print("no iPhone simulator on this runner", file=sys.stderr)
              raise SystemExit(1)
          print(f"iphone_udid={phones[0][4]}")
          print(f"iphone_name={phones[0][3]}")
          print("iPhone:", phones[0][3], file=sys.stderr)
          if pads:
              print(f"ipad_udid={pads[0][4]}")
              print(f"ipad_name={pads[0][3]}")
              print("iPad:", pads[0][3], file=sys.stderr)
          else:
              print("no iPad simulator on this runner", file=sys.stderr)
          PY
      - name: Take the pictures
        working-directory: ios
        env:
          IPHONE: ${{ steps.sim.outputs.iphone_udid }}
          IPHONE_NAME: ${{ steps.sim.outputs.iphone_name }}
          IPAD: ${{ steps.sim.outputs.ipad_udid }}
          IPAD_NAME: ${{ steps.sim.outputs.ipad_name }}
          GRAPH: "-only-testing:RedPenUITests/GraphPreviewUITests"
          TOUR: "-only-testing:RedPenUITests/DesignTourUITests"
          ARABIC: "-only-testing:RedPenUITests/ArabicUITests"
        run: |
          set -o pipefail
          # one xcodebuild run: the simulator, its result bundle and log, then
          # which tests; the second and third runs reuse the first one's build
          run_tests() {
            local udid="$1" bundle="$2" log="$3"
            shift 3
            xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
              -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build-sim \
              -resultBundlePath "../$bundle" "$@" \
              -skipMacroValidation -skipPackagePluginValidation \
              SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
              CODE_SIGNING_ALLOWED=NO \
              test 2>&1 | tee "../$log" | grep -E "error:|Test Case|TEST |\*\* " || true
          }
          boot() {
            xcrun simctl boot "$1" || true
            xcrun simctl bootstatus "$1" -b || true
            xcrun simctl status_bar "$1" override --time "9:41" --batteryLevel 100 \
              --batteryState charged --wifiBars 3 || true
          }

          echo "iPhone: $IPHONE_NAME ($IPHONE)"
          boot "$IPHONE"
          # a screen recording of each 3D map test, for the owner to watch:
          # one file per test, in HEVC, so none comes near GitHub's 100 MB
          # limit on a single file (one recording of every test was 127 MB)
          for t in $(grep -oE 'func test[A-Za-z0-9_]+' UITests/GraphPreviewUITests.swift | awk '{print $2}'); do
            xcrun simctl io "$IPHONE" recordVideo --codec=hevc --force "../graph-$t.mp4" &
            REC=$!
            sleep 2
            run_tests "$IPHONE" "iphone-graph-$t.xcresult" "iphone-graph-$t.log" "$GRAPH/$t"
            kill -INT $REC || true
            wait $REC || true
          done
          # the tour, on the same phone, not recorded
          run_tests "$IPHONE" iphone-tour.xcresult iphone-tour.log "$TOUR"
          # then the same phone in Arabic (launch arguments only)
          run_tests "$IPHONE" iphone-arabic.xcresult iphone-arabic.log "$ARABIC"
          xcrun simctl shutdown "$IPHONE" || true

          if [ -n "$IPAD" ]; then
            echo "iPad: $IPAD_NAME ($IPAD)"
            boot "$IPAD"
            run_tests "$IPAD" ipad.xcresult ipad.log "$GRAPH" "$TOUR"
            xcrun simctl shutdown "$IPAD" || true
          else
            echo "no iPad simulator on this runner" | tee ../ipad.log
          fi
      - name: Push the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shots/iphone out/shots/ipad
          # name each picture after its attachment; the 3D map's with graph-
          # in front, so they sort apart from the tour's numbered steps
          cat > "$RUNNER_TEMP/name_shots.py" <<'PY'
          import json, os, shutil, sys
          raw, dest = sys.argv[1], sys.argv[2]
          m = json.load(open(os.path.join(raw, 'manifest.json')))
          for test in m:
              graph = 'GraphPreview' in (test.get('testIdentifier') or '')
              for a in test.get('attachments', []):
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  base = name.split('_')[0] if '_' in name else name
                  base = os.path.splitext(base)[0]
                  if graph:
                      base = 'graph-' + base
                  ext = os.path.splitext(a['exportedFileName'])[1] or '.png'
                  target = os.path.join(dest, base + ext)
                  n = 2
                  while os.path.exists(target):
                      target = os.path.join(dest, f"{base}-{n}{ext}")
                      n += 1
                  shutil.copy(os.path.join(raw, a['exportedFileName']), target)
          PY
          for pair in $(ls -d iphone-graph-*.xcresult 2>/dev/null | sed 's/$/:iphone/') iphone-tour.xcresult:iphone iphone-arabic.xcresult:iphone ipad.xcresult:ipad; do
            bundle="${pair%%:*}"
            device="${pair##*:}"
            [ -d "$bundle" ] || continue
            rm -rf out/raw
            xcrun xcresulttool export attachments --path "$bundle" --output-path out/raw || true
            if [ -f out/raw/manifest.json ]; then
              python3 "$RUNNER_TEMP/name_shots.py" out/raw "out/shots/$device" || true
            fi
            rm -rf out/raw
          done
          # the recordings; one that is still over 95 MB is left out (and
          # said so in the log) rather than failing the push of everything
          : > out/videos.txt
          for v in graph-*.mp4; do
            [ -f "$v" ] || continue
            bytes=$(stat -f%z "$v")
            if [ "$bytes" -lt 95000000 ]; then
              cp "$v" "out/shots/iphone/$v"
            else
              echo "$v left out: $bytes bytes" >> out/videos.txt
            fi
          done

          # the test lines and any errors, per run
          : > out/log.txt
          for log in iphone-graph-*.log iphone-tour.log iphone-arabic.log ipad.log; do
            [ -f "$log" ] || continue
            echo "== $log" >> out/log.txt
            grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" "$log" | tail -30 >> out/log.txt || true
          done
          for log in iphone-graph-*.log iphone-tour.log iphone-arabic.log ipad.log; do
            [ -f "$log" ] && grep -E "error:" "$log" | sed -E 's#^.*/ios/##'
          done | sort -u | head -40 >> out/log.txt || true

          # one page with every picture, for looking through on GitHub
          {
            echo "# Design preview"
            echo
            echo "Commit ${GITHUB_SHA}. Test output: [log.txt](log.txt)."
            for device in iphone ipad; do
              echo
              echo "## $device"
              for f in $(ls "out/shots/$device" | sort); do
                case "$f" in
                  *.png|*.jpg|*.jpeg|*.heic)
                    echo
                    echo "### ${f%.*}"
                    echo
                    echo "<img src=\"shots/$device/$f\" width=\"360\">"
                    ;;
                  *.mp4)
                    echo
                    echo "- Recording: [$f](shots/$device/$f)"
                    ;;
                esac
              done
            done
          } > out/README.md

          cd out
          git init -q && git checkout -q -b design-preview
          git config user.name red-pen-preview && git config user.email preview@users.noreply.github.com
          git add -A && git commit -q -m "design preview $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" design-preview:design-preview
