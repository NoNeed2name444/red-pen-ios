# Screenshots of a screen for the owner to check the design before trying the
# app: the 3D idea map at rest, a moment later, in landscape and mid-drag, on
# an iPhone simulator. A push to a preview/** branch runs it; the pictures land
# on the design-preview branch.
name: Design preview
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: design-preview
  cancel-in-progress: true
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Take the pictures
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone.*Pro" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild -project RedPen.xcodeproj -scheme RedPen -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build-sim \
            -resultBundlePath ../preview.xcresult \
            -only-testing:RedPenUITests/GraphPreviewUITests \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee ../preview.log | grep -E "error:|Test Case|TEST |\*\* " || true
      - name: Push the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shots
          xcrun xcresulttool export attachments --path preview.xcresult --output-path out/raw || true
          # name each picture after its attachment
          if [ -f out/raw/manifest.json ]; then
            python3 - <<'PY'
          import json, os, shutil
          m = json.load(open('out/raw/manifest.json'))
          for test in m:
              for a in test.get('attachments', []):
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  base = name.split('_')[0] if '_' in name else name
                  base = os.path.splitext(base)[0]
                  shutil.copy(os.path.join('out/raw', a['exportedFileName']), f"out/shots/{base}.png")
          PY
          fi
          rm -rf out/raw
          grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" preview.log | tail -30 > out/log.txt || true
          grep -E "error:" preview.log | sed -E 's#^.*/ios/##' | sort -u | head -40 >> out/log.txt || true
          cd out
          git init -q && git checkout -q -b design-preview
          git config user.name red-pen-preview && git config user.email preview@users.noreply.github.com
          git add -A && git commit -q -m "design preview $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" design-preview:design-preview
