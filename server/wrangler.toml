name = "redpen-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "redpen-auth"
# filled in by `wrangler d1 create redpen-auth`
database_id = ""

# Slide images, under the hash of their own bytes. A term of lecture pictures is
# gigabytes; a database is the wrong place for it.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "redpen-blobs"

# Cloudflare's own models, on the account's free daily allowance: CramDown
# Cloud's fallback when Gemini's free quota is spent.
[ai]
binding = "AI"

[vars]
# Not secret: the bundle id Apple's tokens must be addressed to, the address
# codes are sent from, and Google's public client id.
APPLE_BUNDLE_ID = "com.cramdown.app"
GOOGLE_CLIENT_ID = ""
# CramDown Cloud (Pro): Baichuan-M3 on Baichuan's own API (key in the
# AI_WRITER_KEY secret, from BAICHUAN_API_KEY), then Gemini through the Firebase
# project (FIREBASE_* secrets), then Workers AI below. Each takes over when the
# one before is busy or out of quota.
AI_WRITER_URL = "https://api.baichuan-ai.com/v1"
AI_WRITER_MODEL = "Baichuan-M3"
AI_BASE_URL = "https://router.huggingface.co/v1"
AI_DAILY_LIMIT = "400"
CLOUD_MODELS = "gemini-3.5-flash,gemini-3.5-flash-lite"
FALLBACK_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Accounts that are always Pro for the cloud models (comma-separated ids).
OWNER_ACCOUNT_IDS = ""

# Secrets are NOT in this file, and must never be added to it - it is in the
# repository. Set each one with `wrangler secret put NAME`:
#   SESSION_SECRET        a long random string; signs sessions and peppers codes
#   GOOGLE_CLIENT_SECRET  from the Google Cloud console
#   AI_API_KEY            the upstream key (a Hugging Face token for the router)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
#                         an App Store Connect in-app purchase key, so the worker
#                         can ask Apple whether a subscription is live
