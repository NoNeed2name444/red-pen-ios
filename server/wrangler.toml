name = "redpen-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "redpen-auth"
# filled in by `wrangler d1 create redpen-auth`
database_id = ""

# Slide images, under the hash of their own bytes. A term of lecture pictures is
# gigabytes; a database is the wrong place for it.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "redpen-blobs"

# Cloudflare's own models, on the account's free daily allowance: CramDown
# Cloud's fallback when Gemini's free quota is spent.
[ai]
binding = "AI"

[vars]
# Not secret: the bundle id Apple's tokens must be addressed to, the address
# codes are sent from, and Google's public client id.
APPLE_BUNDLE_ID = "com.cramdown.app"
GOOGLE_CLIENT_ID = ""
# CramDown Cloud (Pro), for now: Gemini, then Workers AI - both free, nothing
# to pay for or set up. At launch: add the NOVITA_API_KEY repository secret and
# redeploy, and Baichuan-M2-32B on Novita's API goes first (key in the
# AI_WRITER_KEY secret, from NOVITA_API_KEY; about $0.07 per million tokens,
# not used for training), then Gemini through the Firebase project
# (FIREBASE_* secrets), then Workers AI below. Each takes over when the one
# before is busy or out of quota. Baichuan-M3 has no pay-per-use host outside
# Baichuan's own China-only platform.
AI_WRITER_URL = "https://api.novita.ai/v3/openai"
AI_WRITER_MODEL = "baichuan/baichuan-m2-32b"
AI_BASE_URL = "https://router.huggingface.co/v1"
AI_DAILY_LIMIT = "400"
# Google's free daily allowances, tried in turn (3.5 Flash 20 a day,
# Flash-Lite 500, Gemma 4 the most)
CLOUD_MODELS = "gemini-3.5-flash,gemini-3.5-flash-lite,gemma-4-31b-it"
TRANSCRIBE_MODELS = "gemini-3.5-flash,gemini-3.5-flash-lite"
# Pro pays for everything that costs money (see budget() in ai.js). Until
# launch PRO_PAYS stays "off" and only free services are used. At launch:
# put the paid accounts in place (Firebase Blaze plan; optionally a Novita
# key as NOVITA_API_KEY), set PRO_NET_MONTHLY_USD to what Apple pays per
# subscription per month after its cut, FIXED_MONTHLY_USD to the monthly
# bills that don't depend on use, and PRO_PAYS = "on". Paid calls are then
# limited to COST_SHARE of Pro revenue minus the fixed bills, shared equally
# between Pro accounts. GEMINI_PRICES is dollars per million tokens,
# input/output, for every paid model - check them at launch.
PRO_PAYS = "off"
PRO_NET_MONTHLY_USD = ""
COST_SHARE = "0.6"
# Every bill that isn't per AI call, in dollars a month, by name. Add a line
# for any new cost; Pro's budget takes it off before anything else is spent.
# (Apple's $99 a year is $8.25 a month; GitHub Actions minutes for a private
# repo, Cloudflare Workers Paid $5, a rented GPU server, ...)
MONTHLY_BILLS = "apple-developer:8.25,github-actions:0,cloudflare-workers:0"
# Gemini 3.1 Pro first once Pro pays: Google's frontier model, paid only (its
# free allowance is 0), reachable through the same Firebase project
PAID_MODELS = "gemini-3.1-pro-preview,gemini-3.5-flash,gemini-3.5-flash-lite,gemma-4-31b-it"
GEMINI_PRICES = "gemini-3.1-pro-preview:2.00/12.00,gemini-3.5-flash:0.30/2.50,gemini-3.5-flash-lite:0.10/0.40,baichuan/baichuan-m2-32b:0.07/0.07"
FALLBACK_MODEL = "@cf/nvidia/nemotron-3-120b-a12b"
# Accounts that are always Pro for the cloud models (comma-separated ids).
OWNER_ACCOUNT_IDS = ""

# Secrets are NOT in this file, and must never be added to it - it is in the
# repository. Set each one with `wrangler secret put NAME`:
#   SESSION_SECRET        a long random string; signs sessions and peppers codes
#   GOOGLE_CLIENT_SECRET  from the Google Cloud console
#   AI_API_KEY            the upstream key (a Hugging Face token for the router)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
#                         an App Store Connect in-app purchase key, so the worker
#                         can ask Apple whether a subscription is live
