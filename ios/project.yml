name: RedPen
options:
  bundleIdPrefix: com.redpen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  # Gemma-4-E2B fallback path for devices that can't run Apple's on-device
  # model (older hardware, Apple Intelligence off) — see GemmaModel.swift.
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    branch: main
targets:
  RedPen:
    type: application
    platform: iOS
    sources:
      - path: RedPen
    dependencies:
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
      - package: LocalLLMClient
        product: LocalLLMClientUtility
    info:
      path: RedPen/Info.plist
      properties:
        CFBundleDisplayName: Red Pen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redpen.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  RedPen:
    build:
      targets:
        RedPen: all
    run:
      config: Debug
