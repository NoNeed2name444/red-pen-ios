name: RedPen
options:
  bundleIdPrefix: com.cramdown
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  # Gemma-4-E2B fallback path for devices that can't run Apple's on-device
  # model (older hardware, Apple Intelligence off) - see GemmaModel.swift.
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    branch: main
targets:
  RedPen:
    type: application
    platform: iOS
    sources:
      - path: RedPen
        # RedPen/Tests holds standalone suites: each one is top-level code that
        # swift-tests.yml copies to main.swift and RUNS. Swift allows top-level
        # statements only in a file called main.swift, so sweeping them into the
        # app target fails the whole build with "expressions are not allowed at
        # the top level" - which is exactly what happened the first time a test
        # suite landed in this folder.
        excludes:
          - "Tests/**"
    dependencies:
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
    entitlements:
      path: RedPen/RedPen.entitlements
      properties:
        # Sign in with Apple needs the capability, not just the button. Without
        # it the sheet appears and then fails with an unhelpful error.
        com.apple.developer.applesignin:
          - Default
    info:
      path: RedPen/Info.plist
      properties:
        CFBundleDisplayName: CramDown
        UILaunchScreen: {}
        # The phone stays upright - a card deck held one-handed has no reason
        # to rotate - but an iPad is used on a desk, in a stand, on a keyboard
        # case, and refusing to turn there is simply broken.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # iOS terminates an app that reaches for either of these without a
        # stated reason, so these two strings are load-bearing, not paperwork.
        # They also say the honest thing: the recognition happens here, because
        # LectureTranscriber forces requiresOnDeviceRecognition and refuses
        # rather than falling back to a server.
        NSSpeechRecognitionUsageDescription: CramDown turns your lecture recording into a transcript on this device. The recording is never uploaded.
        NSMicrophoneUsageDescription: CramDown uses the microphone to record a lecture for transcription on this iPhone.
        # A lecture should keep playing with the screen off.
        UIBackgroundModes:
          - audio
        # Google's sign-in comes back to redpen://auth. The scheme has to be
        # declared or the system browser has nowhere to return to.
        CFBundleURLTypes:
          - CFBundleURLName: com.redpen.app.auth
            CFBundleURLSchemes:
              - redpen
        # Configuration rather than source, so a build can point at a local
        # worker and a real client id without editing Swift. Both are filled in
        # per build; empty means the app says sign-in is not set up rather than
        # opening a broken page.
        RedPenAuthBaseURL: $(RED_PEN_AUTH_URL)
        RedPenGoogleClientID: $(RED_PEN_GOOGLE_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty by default: a build that has not been given these says so.
        RED_PEN_AUTH_URL: ""
        RED_PEN_GOOGLE_CLIENT_ID: ""
        # LocalLLMClientLlamaC's own header hard-errors ("needs to be
        # compiled in C++ interoperability mode") unless the CONSUMING
        # target - this app, not just the package's own target - also
        # builds with Swift/C++ interop on. The package sets this for
        # itself in Package.swift (.interoperabilityMode(.Cxx)), but that
        # doesn't propagate to a plain .xcodeproj app target automatically.
        OTHER_SWIFT_FLAGS: -cxx-interoperability-mode=default
  RedPenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RedPen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RedPen
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.uitests
schemes:
  RedPen:
    build:
      targets:
        RedPen: all
        RedPenUITests: [test]
    test:
      targets:
        - RedPenUITests
    run:
      config: Debug
      # Products come from this file until they exist in App Store Connect, so
      # the paywall can be opened, bought from and cancelled on a simulator
      # with no developer account attached.
      storeKitConfiguration: RedPen/RedPen.storekit
